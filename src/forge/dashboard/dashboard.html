<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge Pipeline Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.06);
    --text: #e2e8f0;
    --text-dim: #64748b;
    --text-muted: #475569;
    --accent: #818cf8;
    --accent-glow: rgba(129,140,248,0.15);
    --green: #34d399;
    --green-glow: rgba(52,211,153,0.15);
    --amber: #fbbf24;
    --amber-glow: rgba(251,191,36,0.15);
    --red: #f87171;
    --red-glow: rgba(248,113,113,0.15);
    --pink: #f472b6;
    --purple: #c084fc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
  }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header-right { display: flex; align-items: center; gap: 20px; }
  .refresh-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--surface2);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .refresh-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
    margin: 0;
  }
  .stat-card {
    flex: 1;
    background: var(--surface);
    padding: 20px 30px;
    text-align: center;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.amber { color: var(--amber); }
  .stat-value.pink { color: var(--pink); }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Main content */
  .main { padding: 30px 40px; }

  /* Project card */
  .project {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 24px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .project:hover { border-color: rgba(255,255,255,0.12); }
  .project-header {
    padding: 24px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    cursor: pointer;
  }
  .project-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
    max-width: 800px;
    line-height: 1.4;
  }
  .project-meta {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .project-meta span { display: flex; align-items: center; gap: 5px; }

  /* Status badge */
  .badge {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .badge-completed { background: var(--green-glow); color: var(--green); border: 1px solid rgba(52,211,153,0.2); }
  .badge-executing, .badge-running { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(129,140,248,0.2); animation: glow 2s infinite; }
  .badge-failed { background: var(--red-glow); color: var(--red); border: 1px solid rgba(248,113,113,0.2); }
  .badge-inactive, .badge-orphaned { background: rgba(100,116,139,0.1); color: var(--text-dim); border: 1px solid var(--border); }
  .badge-planning { background: var(--amber-glow); color: var(--amber); border: 1px solid rgba(251,191,36,0.2); animation: glow 2s infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50% { box-shadow: 0 0 20px -5px currentColor; }
  }

  /* Sections */
  .project-body { padding: 0 28px 28px; }
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 600;
  }

  /* Pipeline DAG */
  .dag {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }
  .dag-tier {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dag-connector {
    display: flex;
    justify-content: center;
    padding: 0 0 0 0;
    color: var(--text-muted);
    font-size: 12px;
  }
  .dag-nodes {
    display: flex;
    gap: 10px;
    flex: 1;
    justify-content: center;
  }
  .dag-node {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    min-width: 130px;
    text-align: center;
    position: relative;
    transition: all 0.3s;
    cursor: default;
  }
  .dag-node-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .dag-node-time {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .dag-node-icon {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .dag-node-retry {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 700;
    background: var(--amber);
    color: #000;
  }
  .dag-node.complete {
    border-color: rgba(52,211,153,0.3);
    background: linear-gradient(135deg, rgba(52,211,153,0.05), rgba(52,211,153,0.02));
  }
  .dag-node.complete .dag-node-icon { background: var(--green); color: #fff; }
  .dag-node.complete .dag-node-name { color: var(--green); }
  .dag-node.in_progress, .dag-node.running {
    border-color: rgba(129,140,248,0.4);
    background: linear-gradient(135deg, rgba(129,140,248,0.08), rgba(129,140,248,0.02));
    animation: nodeGlow 2s infinite;
  }
  @keyframes nodeGlow {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50% { box-shadow: 0 0 30px -10px var(--accent); }
  }
  .dag-node.in_progress .dag-node-icon, .dag-node.running .dag-node-icon {
    background: var(--accent);
    color: #fff;
    animation: spin 1.5s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .dag-node.in_progress .dag-node-name, .dag-node.running .dag-node-name { color: var(--accent); }
  .dag-node.failed {
    border-color: rgba(248,113,113,0.3);
    background: linear-gradient(135deg, rgba(248,113,113,0.05), rgba(248,113,113,0.02));
  }
  .dag-node.failed .dag-node-icon { background: var(--red); color: #fff; }
  .dag-node.failed .dag-node-name { color: var(--red); }
  .dag-node.pending {
    opacity: 0.4;
  }

  /* Planning phases */
  .phases {
    display: flex;
    gap: 6px;
    margin-bottom: 28px;
    align-items: center;
  }
  .phase {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: center;
    transition: all 0.3s;
    position: relative;
  }
  .phase-name {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .phase-time {
    font-size: 10px;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  .phase.complete {
    border-color: rgba(52,211,153,0.3);
    background: linear-gradient(135deg, rgba(52,211,153,0.06), transparent);
  }
  .phase.complete .phase-name { color: var(--green); }
  .phase.in_progress {
    border-color: rgba(251,191,36,0.3);
    background: linear-gradient(135deg, rgba(251,191,36,0.06), transparent);
  }
  .phase.in_progress .phase-name { color: var(--amber); }
  .phase-arrow {
    color: var(--text-muted);
    font-size: 14px;
    flex-shrink: 0;
  }

  /* Timeline bar */
  .timeline-bar {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .timeline-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .timeline-track {
    display: flex;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    background: rgba(255,255,255,0.03);
  }
  .timeline-segment {
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    overflow: hidden;
    white-space: nowrap;
    transition: all 0.3s;
    cursor: default;
  }
  .timeline-segment:hover {
    filter: brightness(1.2);
  }
  .timeline-segment[data-step="code"] { background: var(--accent); }
  .timeline-segment[data-step="lint"] { background: #6366f1; }
  .timeline-segment[data-step="test"] { background: var(--green); }
  .timeline-segment[data-step="db_test"] { background: #2dd4bf; }
  .timeline-segment[data-step="e2e"] { background: var(--pink); }
  .timeline-segment[data-step="smoke"] { background: var(--amber); }
  .timeline-segment[data-step="visual"] { background: var(--purple); }
  .timeline-segment[data-step="code_review"] { background: #fb923c; }
  .timeline-segment[data-step="report"] { background: #94a3b8; }
  .timeline-segment[data-step="create_pr"] { background: #38bdf8; }
  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 10px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
  }

  /* Error panel */
  .error-panel {
    background: rgba(248,113,113,0.05);
    border: 1px solid rgba(248,113,113,0.15);
    border-radius: 10px;
    padding: 16px 20px;
    margin-top: 16px;
  }
  .error-panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--red);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .error-panel-text {
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    line-height: 1.5;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* Collapsible */
  .collapsible-body { display: none; }
  .project.expanded .collapsible-body { display: block; }
  .expand-icon { transition: transform 0.3s; color: var(--text-dim); }
  .project.expanded .expand-icon { transform: rotate(180deg); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 80px 40px;
    color: var(--text-dim);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
  .empty-text { font-size: 16px; }

  /* Tooltip */
  .dag-node .tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 10;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  .dag-node:hover .tooltip { display: block; }
  .tooltip-row { display: flex; justify-content: space-between; gap: 16px; }
  .tooltip-label { color: var(--text-dim); }
  .tooltip-value { font-family: 'JetBrains Mono', monospace; color: var(--text); }

  /* Info panels grid */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
    margin-top: 24px;
  }
  .info-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    transition: border-color 0.3s;
  }
  .info-card:hover { border-color: rgba(255,255,255,0.12); }
  .info-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .info-card-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-card-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 12px;
  }
  .info-card-badge.green { background: var(--green-glow); color: var(--green); }
  .info-card-badge.red { background: var(--red-glow); color: var(--red); }
  .info-card-badge.amber { background: var(--amber-glow); color: var(--amber); }
  .info-card-badge.accent { background: var(--accent-glow); color: var(--accent); }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
  }
  .info-row + .info-row { border-top: 1px solid var(--border); }
  .info-label { color: var(--text-dim); }
  .info-value {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 13px;
  }
  .info-value.green { color: var(--green); }
  .info-value.red { color: var(--red); }
  .info-value.amber { color: var(--amber); }
  .info-value.accent { color: var(--accent); }
  .info-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.2s;
  }
  .info-link:hover { color: #a5b4fc; text-decoration: underline; }

  /* Code review issues list */
  .review-issue {
    background: rgba(248,113,113,0.04);
    border: 1px solid rgba(248,113,113,0.1);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 8px;
    font-size: 12px;
  }
  .review-issue-file {
    font-family: 'JetBrains Mono', monospace;
    color: var(--amber);
    font-size: 11px;
    margin-bottom: 4px;
  }
  .review-issue-msg { color: var(--text-dim); line-height: 1.4; }
  .review-issue-severity {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 1px 6px;
    border-radius: 4px;
    margin-right: 6px;
  }
  .severity-error { background: var(--red-glow); color: var(--red); }
  .severity-warning { background: var(--amber-glow); color: var(--amber); }
  .severity-info { background: var(--accent-glow); color: var(--accent); }

  /* Plan summary */
  .plan-summary {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    max-height: 600px;
    overflow-y: auto;
    margin-top: 8px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border-radius: 8px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
  }

  /* Divider */
  .section-divider {
    border-top: 1px solid var(--border);
    margin: 24px 0 20px;
    padding-top: 20px;
  }

  /* Delete button */
  .delete-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 8px;
    transition: all 0.2s;
    margin-left: 10px;
  }
  .delete-btn:hover {
    background: var(--red-glow);
    border-color: rgba(248,113,113,0.3);
    color: var(--red);
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .modal h3 { margin-bottom: 12px; font-size: 18px; }
  .modal p { color: var(--text-dim); margin-bottom: 20px; font-size: 14px; }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }
  .modal-btn {
    padding: 10px 24px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .modal-btn-cancel { background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border); }
  .modal-btn-cancel:hover { background: var(--border); }
  .modal-btn-delete { background: var(--red); color: #fff; }
  .modal-btn-delete:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">F</div>
    <div class="header-title">Forge Dashboard</div>
  </div>
  <div class="header-right">
    <div class="refresh-badge">
      <div class="refresh-dot"></div>
      <span id="refresh-status">Auto-refresh 3s</span>
    </div>
  </div>
</div>

<div class="stats-bar" id="stats-bar"></div>
<div class="main" id="main">
  <div class="empty">
    <div class="empty-icon">&#9881;</div>
    <div class="empty-text">Loading sessions...</div>
  </div>
</div>

<!-- Delete confirmation modal -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>Delete Session?</h3>
    <p>This will permanently delete all session data and cannot be undone.</p>
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" onclick="cancelDelete()">Cancel</button>
      <button class="modal-btn modal-btn-delete" onclick="executeDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
// Use the same origin as the page (single server)
const API_BASE = window.location.origin;
const artifactCache = {};
let pendingDeleteId = null;
const expandedSessions = new Set(); // Track which sessions are expanded
let isFirstRender = true;
let lastDataJSON = ''; // Skip re-render when data unchanged

function dur(start, end) {
  if (!start || !end) return '--';
  const ms = new Date(end) - new Date(start);
  if (ms < 0) return '--';
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return `${m}m ${rs}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function nodeIcon(status) {
  switch(status) {
    case 'complete': case 'completed': return '&#10003;';
    case 'in_progress': case 'running': return '&#8635;';
    case 'failed': return '&#10007;';
    default: return '';
  }
}

function statusText(status) {
  return (status || 'pending').replace(/_/g, ' ');
}

// DAG layout: group steps into tiers based on the dependency graph
const PIPELINE_TIERS = [
  ['code'],
  ['lint', 'test', 'db_test'],
  ['e2e', 'code_review'],
  ['smoke', 'visual'],
  ['report'],
  ['create_pr'],
];

function renderDAG(steps) {
  if (!steps) return '';
  const stepNames = Object.keys(steps);

  const activeTiers = PIPELINE_TIERS.filter(tier =>
    tier.some(s => stepNames.includes(s))
  );

  return activeTiers.map((tier, i) => {
    const nodes = tier.filter(s => stepNames.includes(s)).map(name => {
      const step = steps[name];
      const status = step.status || 'pending';
      const duration = dur(step.started_at, step.completed_at);
      const retries = step.retries || 0;

      const prettyName = name.replace(/_/g, ' ');

      let tooltipHtml = `
        <div class="tooltip">
          <div class="tooltip-row"><span class="tooltip-label">Status</span><span class="tooltip-value">${statusText(status)}</span></div>
          <div class="tooltip-row"><span class="tooltip-label">Duration</span><span class="tooltip-value">${duration}</span></div>
          ${retries > 0 ? `<div class="tooltip-row"><span class="tooltip-label">Retries</span><span class="tooltip-value">${retries}</span></div>` : ''}
          ${step.started_at ? `<div class="tooltip-row"><span class="tooltip-label">Started</span><span class="tooltip-value">${new Date(step.started_at).toLocaleTimeString()}</span></div>` : ''}
        </div>
      `;

      return `
        <div class="dag-node ${status}">
          ${status !== 'pending' ? `<div class="dag-node-icon">${nodeIcon(status)}</div>` : ''}
          ${retries > 0 ? `<div class="dag-node-retry">${retries}</div>` : ''}
          <div class="dag-node-name">${prettyName}</div>
          <div class="dag-node-time">${status === 'pending' ? 'waiting' : duration}</div>
          ${tooltipHtml}
        </div>
      `;
    }).join('');

    const connector = i < activeTiers.length - 1
      ? `<div class="dag-connector">&#8595;</div>`
      : '';

    return `
      <div class="dag-tier">
        <div class="dag-nodes">${nodes}</div>
      </div>
      ${connector}
    `;
  }).join('');
}

function renderTimelineBar(steps) {
  if (!steps) return '';
  const entries = Object.entries(steps).filter(([,s]) => s.started_at && s.completed_at);
  if (entries.length === 0) return '';

  const allStart = Math.min(...entries.map(([,s]) => new Date(s.started_at)));
  const allEnd = Math.max(...entries.map(([,s]) => new Date(s.completed_at)));
  const totalMs = allEnd - allStart;
  if (totalMs <= 0) return '';

  const segments = entries.map(([name, s]) => {
    const width = (new Date(s.completed_at) - new Date(s.started_at));
    const pct = Math.max((width / totalMs) * 100, 3);
    const d = dur(s.started_at, s.completed_at);
    const label = pct > 8 ? name.replace(/_/g, ' ') : '';
    return `<div class="timeline-segment" data-step="${name}" style="width:${pct}%" title="${name}: ${d}">${label}</div>`;
  }).join('');

  const legend = entries.map(([name, s]) => {
    const d = dur(s.started_at, s.completed_at);
    return `<div class="legend-item"><div class="legend-dot" style="background:var(--${name === 'code' ? 'accent' : name === 'test' ? 'green' : name === 'e2e' ? 'pink' : name === 'smoke' ? 'amber' : 'purple'})"></div>${name.replace(/_/g,' ')} ${d}</div>`;
  }).join('');

  return `
    <div class="timeline-bar">
      <div class="timeline-label">Execution Timeline &middot; Total: ${dur(new Date(allStart).toISOString(), new Date(allEnd).toISOString())}</div>
      <div class="timeline-track">${segments}</div>
      <div class="timeline-legend">${legend}</div>
    </div>
  `;
}

function renderPhases(phases) {
  if (!phases) return '';
  const entries = Object.entries(phases);
  return entries.map(([name, data], i) => {
    const status = data.status || 'pending';
    const d = dur(data.started_at, data.completed_at);
    const arrow = i < entries.length - 1 ? '<span class="phase-arrow">&#8594;</span>' : '';
    return `
      <div class="phase ${status}">
        <div class="phase-name">${name}</div>
        <div class="phase-time">${status === 'pending' ? '...' : d}</div>
      </div>
      ${arrow}
    `;
  }).join('');
}

async function fetchArtifacts(sessionDir) {
  if (!sessionDir) return null;
  if (artifactCache[sessionDir]) return artifactCache[sessionDir];
  try {
    const res = await fetch(`${API_BASE}/artifacts?session_dir=${encodeURIComponent(sessionDir)}`);
    if (res.ok) {
      const data = await res.json();
      artifactCache[sessionDir] = data;
      return data;
    }
  } catch {}
  return null;
}

function renderInfoPanels(artifacts, executor, planner) {
  if (!artifacts && !planner) return '';
  let cards = '';

  // Plan card
  if (artifacts?.plan_summary || planner) {
    const summary = artifacts?.plan_summary || '';
    const firstLine = summary.split('\n').find(l => l.startsWith('#')) || '';
    const title = firstLine.replace(/^#+\s*/, '') || 'Plan';
    const bodyLines = summary.split('\n').slice(1).join('\n').trim();
    const planFile = artifacts?.plan_file || '';
    cards += `
      <div class="info-card" style="grid-column: span 2">
        <div class="info-card-header">
          <span class="info-card-title">&#128220; Plan</span>
          ${planFile ? `<span style="font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace">${planFile.split('/').pop()}</span>` : ''}
        </div>
        <div style="font-size:15px;font-weight:600;margin-bottom:6px">${title}</div>
        ${bodyLines ? `<div class="plan-summary">${bodyLines}</div>` : ''}
      </div>
    `;
  }

  // Code output card
  if (artifacts?.code_checklist || artifacts?.code_actions) {
    const cl = artifacts.code_checklist || {};
    const ca = artifacts.code_actions || {};
    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128187; Code Output</span>
          <span class="info-card-badge green">${ca.outcome || 'pass'}</span>
        </div>
        <div class="info-row"><span class="info-label">Checklist items</span><span class="info-value green">${cl.done || 0}/${cl.total || 0}</span></div>
        <div class="info-row"><span class="info-label">Files created</span><span class="info-value">${cl.files_created || 0}</span></div>
        <div class="info-row"><span class="info-label">Files modified</span><span class="info-value">${cl.files_modified || 0}</span></div>
        <div class="info-row"><span class="info-label">Files read</span><span class="info-value">${ca.files_read || 0}</span></div>
        <div class="info-row"><span class="info-label">Commands run</span><span class="info-value">${ca.commands_run || 0}</span></div>
      </div>
    `;
  }

  // Tests & Verification card — show all test/lint/smoke/visual/e2e steps
  const testStepNames = ['lint', 'test', 'db_test', 'e2e', 'smoke', 'visual'];
  const stepActions = artifacts?.step_actions || {};
  const stepChecklists = artifacts?.step_checklists || {};
  const executorSteps = executor?.steps || {};
  const visibleTestSteps = testStepNames.filter(s => stepActions[s] || stepChecklists[s] || executorSteps[s]);

  if (visibleTestSteps.length > 0) {
    const allPassed = visibleTestSteps.every(s => {
      const st = executorSteps[s]?.status;
      return st === 'complete' || st === 'completed';
    });
    const anyFailed = visibleTestSteps.some(s => executorSteps[s]?.status === 'failed');
    const overallBadge = anyFailed ? 'red' : allPassed ? 'green' : 'amber';
    const overallLabel = anyFailed ? 'FAIL' : allPassed ? 'PASS' : 'RUNNING';

    let rows = '';
    for (const name of visibleTestSteps) {
      const step = executorSteps[name] || {};
      const actions = stepActions[name] || {};
      const checklist = stepChecklists[name] || {};
      const status = step.status || 'pending';
      const prettyName = name.replace(/_/g, ' ');
      const statusColor = (status === 'complete' || status === 'completed') ? 'green' : status === 'failed' ? 'red' : 'amber';
      const statusLabel = status === 'complete' || status === 'completed' ? 'passed' : status;
      const outcome = actions.outcome || '';
      const retries = step.retries || 0;

      // Try to extract a summary from checklist evidence
      const items = checklist.checklist || [];
      const evidence = items.find(i => i.evidence)?.evidence || '';
      const passMatch = evidence.match(/(\d+)\s+passed/);
      const detail = passMatch ? passMatch[0] : outcome || '';

      rows += '<div class="info-row">';
      rows += '<span class="info-label">' + prettyName + (retries > 0 ? ' <span style="color:var(--amber);font-size:11px">(' + retries + ' retry)</span>' : '') + '</span>';
      rows += '<span class="info-value ' + statusColor + '">' + statusLabel + (detail ? ' &middot; ' + detail : '') + '</span>';
      rows += '</div>';
    }

    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#129514; Tests &amp; Checks</span>
          <span class="info-card-badge ${overallBadge}">${overallLabel}</span>
        </div>
        ${rows}
      </div>
    `;
  }

  // Code review card
  if (artifacts?.code_review) {
    const cr = artifacts.code_review;
    const retries = artifacts.code_review_retries || [];
    const verdict = cr.verdict || 'UNKNOWN';
    const isClean = verdict === 'CLEAN';
    const totalIssuesFound = retries.reduce((n, r) => n + (r.issue_count || r.issues?.length || 0), 0);
    const allIssues = retries.flatMap(r => (r.issues || []).map(i => ({...i, attempt: r.attempt})));

    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128269; Code Review</span>
          <span class="info-card-badge ${isClean ? 'green' : 'red'}">${verdict}</span>
        </div>
        <div class="info-row"><span class="info-label">Final verdict</span><span class="info-value ${isClean ? 'green' : 'red'}">${verdict}</span></div>
        <div class="info-row"><span class="info-label">Issues found</span><span class="info-value ${totalIssuesFound > 0 ? 'amber' : 'green'}">${totalIssuesFound}</span></div>
        <div class="info-row"><span class="info-label">Issues fixed</span><span class="info-value green">${isClean ? totalIssuesFound : 0}</span></div>
        <div class="info-row"><span class="info-label">Review attempts</span><span class="info-value">${retries.length + 1}</span></div>
        ${allIssues.map(issue => `
          <div class="review-issue">
            <div class="review-issue-file">
              <span class="review-issue-severity severity-${issue.severity || 'error'}">${issue.severity || 'error'}</span>
              ${issue.file || ''}${issue.line ? ':' + issue.line : ''}
            </div>
            <div class="review-issue-msg">${issue.message || ''}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // PR card
  if (artifacts?.pr_url) {
    const prNum = artifacts.pr_url.match(/#?(\d+)$/)?.[1] || '';
    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128640; Pull Request</span>
          <span class="info-card-badge accent">#${prNum}</span>
        </div>
        <div style="margin-top:4px">
          <a href="${artifacts.pr_url}" target="_blank" class="info-link">${artifacts.pr_url} &#8599;</a>
        </div>
      </div>
    `;
  }

  if (!cards) return '';
  return `
    <div class="section-divider">
      <div class="section-label">Details</div>
      <div class="info-grid">${cards}</div>
    </div>
  `;
}

function renderErrors(steps) {
  if (!steps) return '';
  const errors = Object.entries(steps)
    .filter(([, s]) => s.last_error && s.retries > 0)
    .map(([name, s]) => `
      <div class="error-panel">
        <div class="error-panel-title">&#9888; ${name.replace(/_/g, ' ')} (${s.retries} ${s.retries === 1 ? 'retry' : 'retries'})</div>
        <div class="error-panel-text">${s.last_error}</div>
      </div>
    `);
  return errors.join('');
}

function confirmDelete(sessionId) {
  pendingDeleteId = sessionId;
  document.getElementById('delete-modal').classList.add('show');
}

function cancelDelete() {
  pendingDeleteId = null;
  document.getElementById('delete-modal').classList.remove('show');
}

async function executeDelete() {
  if (!pendingDeleteId) return;
  try {
    await fetch(`${API_BASE}/session/${pendingDeleteId}`, { method: 'DELETE' });
    // Clear artifact cache for this session
    Object.keys(artifactCache).forEach(k => {
      if (k.includes(pendingDeleteId)) delete artifactCache[k];
    });
    fetchData();
  } catch (e) {
    console.error('Delete failed:', e);
  }
  cancelDelete();
}

function toggleExpand(el) {
  el.classList.toggle('expanded');
  const id = el.getAttribute('data-id');
  if (id) {
    if (el.classList.contains('expanded')) {
      expandedSessions.add(id);
    } else {
      expandedSessions.delete(id);
    }
  }
}

function render(data) {
  const projects = data.projects || [];

  // Stats
  const planners = projects.filter(p => p.planner).length;
  const completedSteps = projects.reduce((n, p) => {
    return n + (p.executors || []).reduce((m, e) => {
      return m + Object.values(e.steps || {}).filter(s => s.status === 'complete').length;
    }, 0);
  }, 0);
  const totalRetries = projects.reduce((n, p) => {
    return n + (p.executors || []).reduce((m, e) => {
      return m + Object.values(e.steps || {}).reduce((r, s) => r + (s.retries || 0), 0);
    }, 0);
  }, 0);

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-value accent">${data.total_sessions || 0}</div><div class="stat-label">Sessions</div></div>
    <div class="stat-card"><div class="stat-value green">${completedSteps}</div><div class="stat-label">Steps Done</div></div>
    <div class="stat-card"><div class="stat-value pink">${planners}</div><div class="stat-label">Plans</div></div>
    <div class="stat-card"><div class="stat-value amber">${totalRetries}</div><div class="stat-label">Retries</div></div>
  `;

  if (projects.length === 0) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">&#9881;</div>
        <div class="empty-text">No forge sessions yet. Run <code>forge drive</code> to get started.</div>
      </div>
    `;
    return;
  }

  const cards = projects.map((project, idx) => {
    const status = project.overall_status || 'inactive';
    const planner = project.planner;
    const executor = (project.executors || [])[0];
    const created = project.created_at;
    const problem = project.problem_statement || 'Untitled Session';
    const shortProblem = problem.length > 120 ? problem.substring(0, 120) + '...' : problem;
    const sessionId = project.session_id || (planner ? planner.session_id : executor?.session_id || '');
    const totalDur = executor
      ? dur(executor.created_at, executor.updated_at)
      : planner
        ? dur(planner.created_at, planner.updated_at)
        : '--';

    let body = '';

    if (planner && planner.phases) {
      body += `
        <div class="section-label">Planning Phases</div>
        <div class="phases">${renderPhases(planner.phases)}</div>
      `;
    }

    if (executor && executor.steps) {
      body += `
        <div class="section-label">Pipeline DAG</div>
        <div class="dag">${renderDAG(executor.steps)}</div>
        ${renderTimelineBar(executor.steps)}
        ${renderErrors(executor.steps)}
      `;
    }

    const artifactId = `artifacts-${sessionId.replace(/[^a-zA-Z0-9]/g, '_')}`;

    return `
      <div class="project ${expandedSessions.has(sessionId) || (isFirstRender && idx === 0) ? 'expanded' : ''}" data-id="${sessionId}" data-executor-dir="${executor?.session_dir || ''}" data-planner-dir="${planner?.session_dir || ''}">
        <div class="project-header" onclick="toggleExpand(this.parentElement)">
          <div>
            <div class="project-title">${shortProblem}</div>
            <div class="project-meta">
              <span>&#128337; ${timeAgo(created)}</span>
              <span>&#9201; ${totalDur}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">${sessionId}</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <div class="badge badge-${status}">${statusText(status)}</div>
            <button class="delete-btn" onclick="event.stopPropagation(); confirmDelete('${sessionId}')" title="Delete session">&#128465;</button>
            <svg class="expand-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
          </div>
        </div>
        <div class="collapsible-body">
          <div class="project-body">
            ${body}
            <div id="${artifactId}"></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('main').innerHTML = cards;

  // On first render, seed expandedSessions from the DOM
  if (isFirstRender) {
    document.querySelectorAll('.project.expanded').forEach(el => {
      const id = el.getAttribute('data-id');
      if (id) expandedSessions.add(id);
    });
    isFirstRender = false;
  }

  // Async: fetch and render artifacts for each project
  projects.forEach(async (project) => {
    const executor = (project.executors || [])[0];
    const planner = project.planner;
    const sessionId = project.session_id || (planner ? planner.session_id : executor?.session_id || '');
    const artifactId = `artifacts-${sessionId.replace(/[^a-zA-Z0-9]/g, '_')}`;
    const container = document.getElementById(artifactId);
    if (!container) return;

    const sessionDir = executor?.session_dir;
    if (sessionDir) {
      const artifacts = await fetchArtifacts(sessionDir);
      if (artifacts) {
        container.innerHTML = renderInfoPanels(artifacts, executor, planner);
      }
    }
  });
}

async function fetchData() {
  try {
    const res = await fetch(`${API_BASE}/sessions`);
    if (res.ok) {
      const data = await res.json();
      const dataJSON = JSON.stringify(data);
      if (dataJSON === lastDataJSON && !isFirstRender) return; // Nothing changed, skip re-render
      lastDataJSON = dataJSON;
      // Clear artifact cache when session data changes
      Object.keys(artifactCache).forEach(k => delete artifactCache[k]);
      render(data);
      return;
    }
  } catch {}
  document.getElementById('main').innerHTML = `
    <div class="empty">
      <div class="empty-icon">&#9888;</div>
      <div class="empty-text">Cannot connect to Forge dashboard server.<br>Run: <code>forge dashboard</code></div>
    </div>
  `;
}

fetchData();
setInterval(fetchData, 3000);
</script>
</body>
</html>
