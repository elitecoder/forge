    "plan_summary": "# Final Plan: Rewards Store & Custom Rewards (Issues #41 & #42)\n\n## Executive Summary\n\nThis plan adds a family-scoped rewards store where parents create custom rewards with point costs and kids redeem them by spending earned points, with all redemptions requiring parent approval. The architecture reuses the proven `buy_streak_freeze` atomic RPC pattern for race-safe point deduction, snapshots the cost at redemption time for refund accuracy, and uses a single `resolve_redemption` RPC for both approvals and rejections. The key insight is that every write touching multiple tables (points + stock + redemption record) goes through a `SECURITY DEFINER` RPC with explicit auth checks and EXCEPTION handlers, while reads use RLS-enforced direct table access \u2014 matching the existing codebase's security layering exactly.\n\n## Problem Analysis\n\n### Functional Requirements\n\n| ID | Requirement | Source |\n|----|------------|--------|\n| FR-1 | Parents create custom rewards with title, description, point cost, category, icon, and optional stock limit | Issue #41 |\n| FR-2 | Parents edit, activate/deactivate, and delete rewards | Issue #42 |\n| FR-3 | Kids browse active rewards filtered by category | Issue #41 |\n| FR-4 | Kids redeem rewards by spending points (atomic deduction) | Issue #41 |\n| FR-5 | Redemptions created with `pending` status, require parent approval | Issue #41 |\n| FR-6 | Parents approve or reject pending redemptions; rejection refunds points | Issue #41 |\n| FR-7 | Kids view redemption history with status badges | Issue #41 |\n| FR-8 | Reward categories with icon selection (no file upload) | Issue #42 |\n| FR-9 | Active/inactive toggle for rewards | Issue #42 |\n\n### Non-Functional Requirements\n\n| ID | Requirement | Priority |\n|----|------------|----------|\n| NFR-1 | Atomic point deduction \u2014 no partial states, no double-spending | Critical |\n| NFR-2 | Race-condition safety on stock limits | Critical |\n| NFR-3 | 100% unit test coverage on all new code | Required |\n| NFR-4 | E2E coverage for happy-path flows | Required |\n| NFR-5 | Mobile-first responsive design (320px minimum) | Required |\n| NFR-6 | Accessibility \u2014 keyboard navigable, labeled inputs | Required |\n| NFR-7 | Points never go negative | Critical |\n\n### Constraints\n\n- Next.js 16 App Router, React 19, TypeScript strict, Supabase, Tailwind CSS v4\n- Server Components default; `'use client'` only when needed (rewards page is already client)\n- Migration numbered `015_` (sequential, run via Management API)\n- RLS policies required on all new tables\n- No image upload \u2014 icon selection via emoji grid\n- Existing leaderboard on rewards page must be preserved\n- Out of scope: savings goals (#43), allowance tracking (#44)\n\n### Priority Ordering\n\n1. **Data integrity** (atomic RPCs, correct refunds, no point leakage)\n2. **Security** (auth checks, RLS, role enforcement)\n3. **Correctness** (snapshot costs, stock enforcement, status transitions)\n4. **Completeness** (all user stories implemented)\n5. **UX polish** (loading states, pending points display, URL tabs)\n\n## Design Comparison\n\n### Data Model: `points_cost` Snapshot on Redemptions\n\n- **Design A**: Did not include `points_cost` on `reward_redemptions`. Critique caught this \u2014 refunding using the live reward price is a data integrity bug if the price changes between redemption and rejection. Fixed in refined version.\n- **Design B**: Included `points_cost` snapshot from the original design. The correct approach from day one.\n- **Selected**: Design B's approach. Snapshot the cost at redemption time. This is the standard ledger pattern and ensures refund accuracy regardless of subsequent price edits.\n\n### RPC Structure: Separate vs. Combined Approval/Rejection\n\n- **Design A**: Three RPCs \u2014 `redeem_reward`, `approve_redemption`, `reject_redemption`. More explicit but redundant (approve/reject share 80% of their logic).\n- **Design B**: Two RPCs \u2014 `redeem_reward`, `resolve_redemption(p_action: 'approved' | 'rejected')`. DRY, single entry point for resolution.\n- **Selected**: Design B's combined `resolve_redemption`. Less code duplication, single auth check path, easier to maintain. The `p_action` parameter is validated inside the function.\n\n### Audit Trail: Column Naming\n\n- **Design A (refined)**: Added `rejected_at`/`rejected_by` alongside existing `approved_at`/`approved_by` \u2014 4 nullable columns.\n- **Design B (refined)**: Renamed to `resolved_at`/`resolved_by` \u2014 2 nullable columns covering both outcomes.\n- **Selected**: Design B's `resolved_at`/`resolved_by`. Semantically correct for both actions, fewer columns, and the `status` column already distinguishes approval from rejection.\n\n### PostgreSQL Error Handling\n\n- **Design A**: No EXCEPTION handlers in RPCs. Raw DB errors could break the client's `data.success` contract.\n- **Design B (refined)**: Added `EXCEPTION WHEN OTHERS` handlers that return structured `{ success: false, error: \"...\" }` JSON. Also corrected the false claim about automatic rollback on RETURN.\n- **Selected**: Design B's EXCEPTION handlers. The client always expects `{ success: boolean, error?: string }`. The EXCEPTION block guarantees this contract on all code paths and provides an automatic rollback safety net.\n\n### Delete Strategy\n\n- **Design A (refined)**: `ON DELETE RESTRICT` FK + RLS delete policy blocking when any redemptions exist.\n- **Design B (refined)**: Soft-delete only via `active = false` + explicit `USING(false)` DELETE policies.\n- **Selected**: Merged \u2014 `ON DELETE RESTRICT` FK (Design A) + explicit `USING(false)` DELETE policies (Design B). Belt and suspenders: the FK prevents deletion at the DB level, and the explicit deny policy makes the intent clear. Parents deactivate rewards; they never delete them. The UI guides parents to \"deactivate instead of delete.\"\n\n### Post-Mutation Data Refresh\n\n- **Design A**: Sequential `await` calls for each fetch after mutations. No optimistic updates.\n- **Design B (refined)**: `Promise.all` for parallel fetches. Optional optimistic update for snappier UX.\n- **Selected**: Design B's `Promise.all` pattern. Three independent reads should never be sequential. Optimistic updates are optional but documented for the toggle operation.\n\n### UX Enhancements\n\n- **URL-based tab state** (Design A refined): `useSearchParams` for deep-linking to tabs. Selected \u2014 trivial to implement, enables linking to approval queue.\n- **Pending points display** (Design B refined): Shows \"X points pending approval\" next to balance. Selected \u2014 closes the UX gap where kids see reduced balance with no explanation.\n- **Redemption history pagination** (Design B refined): `.limit(20)` with \"Load more\" button. Selected \u2014 prevents unbounded result sets.\n- **`manage-rewards.tsx` component** (Design A refined): Dedicated component for parent management tab. Selected \u2014 keeps page.tsx manageable, testable in isolation.\n\n### What Both Designs Got Right\n\nBoth designs correctly identified:\n- Reusing the `buy_streak_freeze` atomic RPC pattern\n- `WHERE points >= cost` for race-safe deduction\n- RLS + SECURITY DEFINER dual protection\n- Component structure mirroring TaskCard/TaskForm patterns\n- Points deducted at redemption (not approval) to prevent over-spending\n- Stock restoration on rejection\n- Five fixed categories validated at the app level\n- Emoji-based icon selection following the avatar pattern\n\n### What Both Designs Missed\n\nNeither design specified:\n- How the existing leaderboard section integrates with the new tab structure (leaderboard stays above tabs? becomes its own tab?)\n- **Decision**: Leaderboard remains as a section above the tabs. Tabs only govern the rewards-specific content below it. This preserves the existing layout and avoids burying the leaderboard behind a tab click.\n\n## Synthesized Architecture\n\n### Component Architecture\n\n```\napp/(dashboard)/rewards/page.tsx (existing, modified)\n\u251c\u2500\u2500 Leaderboard section (existing, unchanged \u2014 stays above tabs)\n\u251c\u2500\u2500 Points display: \"{points} points available (X pending approval)\"\n\u251c\u2500\u2500 Tab bar: [Store] [My Rewards] [Manage*] [Approvals*(badge)]\n\u2502   (* = parent-only tabs, URL-driven via ?tab=)\n\u2502\n\u251c\u2500\u2500 tab=store (default):\n\u2502   \u2514\u2500\u2500 <RewardStore>\n\u2502       \u251c\u2500\u2500 Category filter chips (All | Activities | Treats | ...)\n\u2502       \u251c\u2500\u2500 <RewardCard> \u00d7 N (responsive grid)\n\u2502       \u2514\u2500\u2500 <RedeemConfirmModal>\n\u2502\n\u251c\u2500\u2500 tab=my-rewards:\n\u2502   \u2514\u2500\u2500 <RedemptionHistory>\n\u2502       \u2514\u2500\u2500 Redemption items with status badges + \"Load more\"\n\u2502\n\u251c\u2500\u2500 tab=manage (parent only):\n\u2502   \u2514\u2500\u2500 <ManageRewards>\n\u2502       \u251c\u2500\u2500 \"Add Reward\" button\n\u2502       \u251c\u2500\u2500 <RewardCard> \u00d7 N (with edit/toggle/delete actions)\n\u2502       \u2514\u2500\u2500 <RewardForm> (modal, create/edit)\n\u2502\n\u2514\u2500\u2500 tab=approvals (parent only):\n    \u2514\u2500\u2500 <ApprovalQueue>\n        \u2514\u2500\u2500 Approval items with approve/reject buttons\n```\n\n### Component Definitions\n\n**1. `components/rewards/reward-card.tsx`**\n\n```typescript\ninterface RewardCardProps {\n  reward: Reward\n  userPoints: number\n  userRole: 'parent' | 'child'\n  isManageView?: boolean\n  onRedeem?: (rewardId: string) => Promise<void>\n  onEdit?: (reward: Reward) => void\n  onToggle?: (reward: Reward) => Promise<void>\n  onDelete?: (reward: Reward) => Promise<void>\n}\n```\n\n- Child in store: Shows icon, title, description, cost, stock (if limited), \"Redeem\" button\n- \"Redeem\" disabled if `userPoints < reward.points_cost` (shows \"Need X more points\")\n- \"Redeem\" disabled if `reward.stock === 0` (shows \"Out of stock\")\n- Parent in store: Same card, read-only (no redeem button)\n- Parent in manage: Shows edit icon, active/inactive toggle, delete button\n- Inactive rewards in manage: Grayed out with \"Inactive\" badge\n- Loading state on action buttons per the TaskCard pattern\n\n**2. `components/rewards/reward-form.tsx`**\n\n```typescript\ninterface RewardFormProps {\n  isOpen: boolean\n  onClose: () => void\n  onSubmit: (data: RewardFormData) => Promise<void>\n  reward?: Reward  // For edit mode\n}\n\ninterface RewardFormData {\n  title: string\n  description: string\n  points_cost: number\n  category: RewardCategory\n  icon_id: string\n  stock: number | null  // null = unlimited\n}\n```\n\n- Follows TaskForm modal pattern: `useEffect` to populate on edit, reset on create\n- Fields: title (required, max 200), description (optional), points_cost (required, \u2265 1), category (dropdown from `REWARD_CATEGORIES`), icon (grid selection from `REWARD_ICON_OPTIONS`), stock (optional number, \u2265 1 or blank for unlimited)\n- Validation: title required, points_cost > 0, stock \u2265 1 if provided, category must be in `REWARD_CATEGORIES`\n- Icon selection grid follows `role-avatar-step.tsx` pattern: grid of emoji buttons with `ring-2 ring-purple-600` on selected\n- Submit disables button with loading spinner\n\n**3. `components/rewards/redeem-confirm-modal.tsx`**\n\n```typescript\ninterface RedeemConfirmModalProps {\n  isOpen: boolean\n  onClose: () => void\n  onConfirm: () => Promise<void>\n  reward: Reward\n  userPoints: number\n}\n```\n\n- Shows: reward icon + title, \"Spend {cost} points on {title}?\"\n- Shows: current balance \u2192 balance after redemption\n- Confirm button with loading state\n- Error display inline if RPC fails\n\n**4. `components/rewards/reward-store.tsx`**\n\n```typescript\ninterface RewardStoreProps {\n  rewards: Reward[]\n  userPoints: number\n  userRole: 'parent' | 'child'\n  onRedeem: (rewardId: string) => Promise<void>\n}\n```\n\n- State: `selectedCategory: RewardCategory | 'all'`, `selectedReward: Reward | null`\n- Category filter: horizontal scrollable chip buttons (\"All\" default, then each category with emoji)\n- Active chip: `bg-purple-100 text-purple-700 border-purple-300`\n- Inactive chip: `bg-gray-100 text-gray-600 border-gray-200`\n- Reward grid: `grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4`\n- Empty state: \"No rewards available yet. Ask your parents to add some!\"\n- Clicking \"Redeem\" opens `RedeemConfirmModal`\n\n**5. `components/rewards/redemption-history.tsx`**\n\n```typescript\ninterface RedemptionHistoryProps {\n  redemptions: RewardRedemptionWithDetails[]\n  hasMore: boolean\n  onLoadMore: () => void\n  loadingMore: boolean\n}\n```\n\n- List of past redemptions: icon, title, points spent, status badge, timestamp\n- Status badges: pending \u2192 yellow \"Waiting for approval\", approved \u2192 green \"Approved\", rejected \u2192 red \"Rejected \u2014 points refunded\"\n- Sorted by most recent first\n- \"Load more\" button when `hasMore` is true\n- Empty state: \"No rewards redeemed yet. Browse the store to get started!\"\n\n**6. `components/rewards/manage-rewards.tsx`**\n\n```typescript\ninterface ManageRewardsProps {\n  rewards: Reward[]\n  onAdd: () => void\n  onEdit: (reward: Reward) => void\n  onToggle: (reward: Reward) => Promise<void>\n  onDelete: (reward: Reward) => Promise<void>\n}\n```\n\n- \"Add Reward\" button at top\n- Lists all rewards (active first, then inactive grayed out)\n- Each card has edit, toggle active/inactive, delete actions\n- Delete confirmation modal: \"Delete {title}? This cannot be undone.\"\n- Delete error for rewards with redemption history: \"Cannot delete a reward that has been redeemed. Deactivate it instead.\"\n\n**7. `components/rewards/approval-queue.tsx`**\n\n```typescript\ninterface ApprovalQueueProps {\n  redemptions: RewardRedemptionWithDetails[]\n  onApprove: (redemptionId: string) => Promise<void>\n  onReject: (redemptionId: string) => Promise<void>\n}\n```\n\n- List of pending redemptions: child avatar + name, reward icon + title, points cost, time ago\n- \"Approve\" (primary) and \"Reject\" (danger) buttons per item\n- Reject requires confirmation: \"Reject this reward? {cost} points will be refunded.\"\n- Empty state: \"No pending approvals. All caught up!\"\n- Loading state per button (approve/reject independent)\n\n### Communication Pattern\n\nAll data fetching in `page.tsx`. Components receive data via props and callbacks. After any mutation:\n\n```typescript\n// Parallel refresh \u2014 all three are independent reads\nawait Promise.all([\n  fetchProfile(),     // Updates points in header + store\n  fetchRewards(),     // Updates stock, active status\n  fetchRedemptions()  // Updates history + pending count\n])\n```\n\n### Data Model\n\n**`rewards` table**\n\n| Column | Type | Constraints | Notes |\n|--------|------|-------------|-------|\n| `id` | `uuid` | PK, default `gen_random_uuid()` | |\n| `family_id` | `uuid` | FK \u2192 families.id, NOT NULL, ON DELETE CASCADE | Scoping |\n| `title` | `text` | NOT NULL, CHECK `char_length(title) <= 200` | |\n| `description` | `text` | nullable | Optional flavor text |\n| `points_cost` | `integer` | NOT NULL, CHECK `points_cost >= 1` | Whole numbers only |\n| `icon_id` | `text` | NOT NULL, default `'star'` | Key into `REWARD_ICON_OPTIONS` |\n| `category` | `text` | NOT NULL, default `'other'` | No CHECK \u2014 validated at app level |\n| `stock` | `integer` | nullable, CHECK `stock IS NULL OR stock >= 1` | null = unlimited; stock \u2265 1 on create |\n| `active` | `boolean` | NOT NULL, default true | Inactive hides from store |\n| `created_by` | `uuid` | FK \u2192 profiles.id, NOT NULL | Parent who created |\n| `created_at` | `timestamptz` | NOT NULL, default `now()` | |\n| `updated_at` | `timestamptz` | NOT NULL, default `now()` | Auto-maintained by trigger |\n\n**`reward_redemptions` table**\n\n| Column | Type | Constraints | Notes |\n|--------|------|-------------|-------|\n| `id` | `uuid` | PK, default `gen_random_uuid()` | |\n| `reward_id` | `uuid` | FK \u2192 rewards.id, NOT NULL, ON DELETE RESTRICT | Preserves history |\n| `redeemed_by` | `uuid` | FK \u2192 profiles.id, NOT NULL | Child who redeemed |\n| `points_cost` | `integer` | NOT NULL | Snapshot at redemption time |\n| `status` | `text` | NOT NULL, default `'pending'`, CHECK IN ('pending','approved','rejected') | |\n| `redeemed_at` | `timestamptz` | NOT NULL, default `now()` | |\n| `resolved_at` | `timestamptz` | nullable | When parent approved/rejected |\n| `resolved_by` | `uuid` | FK \u2192 profiles.id, nullable | Parent who approved/rejected |\n\n**Relationships**\n\n```\nfamilies 1\u2500\u2500N rewards              (family_id)\nrewards  1\u2500\u2500N reward_redemptions   (reward_id)\nprofiles 1\u2500\u2500N rewards              (created_by)\nprofiles 1\u2500\u2500N reward_redemptions   (redeemed_by)\nprofiles 1\u2500\u2500N reward_redemptions   (resolved_by)\n```\n\n**Invariants**\n- `profiles.points >= 0` always\n- `rewards.stock >= 1` when not null (new rewards); stock decrements to 0 via RPC only\n- Status transitions: `pending \u2192 approved` or `pending \u2192 rejected` only (no reversal)\n- Points deducted at redemption; refunded only on rejection\n- `active = false` rewards cannot be redeemed\n- `stock = 0` rewards cannot be redeemed\n\n### Type Additions \u2014 `lib/types.ts`\n\n```typescript\n// Add to Database['public']['Tables']:\nrewards: {\n  Row: {\n    id: string\n    family_id: string\n    title: string\n    description: string | null\n    points_cost: number\n    icon_id: string\n    category: string\n    stock: number | null\n    active: boolean\n    created_by: string\n    created_at: string\n    updated_at: string\n  }\n  Insert: {\n    id?: string\n    family_id: string\n    title: string\n    description?: string | null\n    points_cost: number\n    icon_id?: string\n    category?: string\n    stock?: number | null\n    active?: boolean\n    created_by: string\n    created_at?: string\n    updated_at?: string\n  }\n  Update: Partial<Omit<rewards['Insert'], 'id'>>\n}\n\nreward_redemptions: {\n  Row: {\n    id: string\n    reward_id: string\n    redeemed_by: string\n    points_cost: number\n    status: 'pending' | 'approved' | 'rejected'\n    redeemed_at: string\n    resolved_at: string | null\n    resolved_by: string | null\n  }\n  Insert: {\n    id?: string\n    reward_id: string\n    redeemed_by: string\n    points_cost: number\n    status?: string\n    redeemed_at?: string\n    resolved_at?: string | null\n    resolved_by?: string | null\n  }\n  Update: Partial<Omit<reward_redemptions['Insert'], 'id'>>\n}\n\n// Add to Database['public']['Functions']:\nredeem_reward: {\n  Args: { p_user_id: string; p_reward_id: string }\n  Returns: { success: boolean; error?: string; points_spent?: number }\n}\nresolve_redemption: {\n  Args: { p_user_id: string; p_redemption_id: string; p_action: string }\n  Returns: { success: boolean; error?: string }\n}\n\n// Convenience types:\nexport type Reward = Database['public']['Tables']['rewards']['Row']\nexport type RewardRedemption = Database['public']['Tables']['reward_redemptions']['Row']\n\nexport type RewardRedemptionWithDetails = RewardRedemption & {\n  rewards: Pick<Reward, 'title' | 'icon_id'>\n  profiles?: Pick<Profile, 'display_name' | 'nickname' | 'avatar_url'>\n}\n\n// Constants:\nexport type RewardCategory = 'screen_time' | 'treats' | 'activities' | 'privileges' | 'other'\n\nexport const REWARD_CATEGORIES: readonly { value: RewardCategory; label: string; emoji: string }[] = [\n  { value: 'activities', label: 'Activities', emoji: '\ud83c\udfaf' },\n  { value: 'treats', label: 'Treats', emoji: '\ud83c\udf6a' },\n  { value: 'screen_time', label: 'Screen Time', emoji: '\ud83d\udcf1' },\n  { value: 'privileges', label: 'Privileges', emoji: '\u2b50' },\n  { value: 'other', label: 'Other', emoji: '\ud83c\udf81' },\n] as const\n\nexport const REWARD_ICON_OPTIONS = [\n  { id: 'star', label: 'Star', emoji: '\u2b50' },\n  { id: 'trophy', label: 'Trophy', emoji: '\ud83c\udfc6' },\n  { id: 'game', label: 'Game', emoji: '\ud83c\udfae' },\n  { id: 'movie', label: 'Movie', emoji: '\ud83c\udfac' },\n  { id: 'ice_cream', label: 'Ice Cream', emoji: '\ud83c\udf66' },\n  { id: 'pizza', label: 'Pizza', emoji: '\ud83c\udf55' },\n  { id: 'cookie', label: 'Cookie', emoji: '\ud83c\udf6a' },\n  { id: 'bike', label: 'Bike Ride', emoji: '\ud83d\udeb2' },\n  { id: 'park', label: 'Park', emoji: '\ud83c\udfde\ufe0f' },\n  { id: 'sleepover', label: 'Sleepover', emoji: '\ud83d\udecf\ufe0f' },\n  { id: 'book', label: 'Book', emoji: '\ud83d\udcda' },\n  { id: 'music', label: 'Music', emoji: '\ud83c\udfb5' },\n  { id: 'art', label: 'Art', emoji: '\ud83c\udfa8' },\n  { id: 'gift', label: 'Gift', emoji: '\ud83c\udf81' },\n  { id: 'crown', label: 'Crown', emoji: '\ud83d\udc51' },\n  { id: 'rocket', label: 'Rocket', emoji: '\ud83d\ude80' },\n] as const\n```\n\n### API Specifications\n\n#### RPCs\n\n| RPC | Args | Returns | Auth |\n|-----|------|---------|------|\n| `redeem_reward` | `p_user_id: uuid, p_reward_id: uuid` | `{ success: bool, error?: string, points_spent?: number }` | `auth.uid() == p_user_id`, must be `child` role, must be in same family as reward |\n| `resolve_redemption` | `p_user_id: uuid, p_redemption_id: uuid, p_action: text` | `{ success: bool, error?: string }` | `auth.uid() == p_user_id`, must be `parent` role, must be in same family as reward |\n\n#### Direct Table Operations (RLS-enforced)\n\n```typescript\n// List active rewards for store\nsupabase.from('rewards').select('*')\n  .eq('family_id', familyId).eq('active', true)\n  .order('category').order('points_cost')\n\n// List all rewards for management (parent)\nsupabase.from('rewards').select('*')\n  .eq('family_id', familyId)\n  .order('active', { ascending: false }).order('created_at', { ascending: false })\n\n// Create reward\nsupabase.from('rewards').insert({\n  family_id: familyId, title, description, points_cost,\n  icon_id, category, stock, created_by: userId\n})\n\n// Update reward\nsupabase.from('rewards').update({ title, description, points_cost, icon_id, category, stock, active })\n  .eq('id', rewardId)\n\n// My redemptions (child) \u2014 paginated\nsupabase.from('reward_redemptions').select('*, rewards(title, icon_id)')\n  .eq('redeemed_by', userId)\n  .order('redeemed_at', { ascending: false })\n  .range(offset, offset + PAGE_SIZE - 1)\n\n// Pending approvals (parent)\nsupabase.from('reward_redemptions')\n  .select('*, rewards!inner(title, icon_id, family_id), profiles!reward_redemptions_redeemed_by_fkey(display_name, nickname, avatar_url)')\n  .eq('rewards.family_id', familyId)\n  .eq('status', 'pending')\n  .order('redeemed_at')\n\n// Redeem\nsupabase.rpc('redeem_reward', { p_user_id: userId, p_reward_id: rewardId })\n\n// Approve/Reject\nsupabase.rpc('resolve_redemption', {\n  p_user_id: userId, p_redemption_id: redemptionId,\n  p_action: 'approved' | 'rejected'\n})\n```\n\n#### Pending Points Aggregation\n\n```typescript\nconst { data: pendingData } = await supabase\n  .from('reward_redemptions')\n  .select('points_cost')\n  .eq('redeemed_by', userId)\n  .eq('status', 'pending')\n\nconst pendingPointsCost = (pendingData ?? []).reduce((sum, r) => sum + r.points_cost, 0)\n```\n\n### Migration SQL\n\n**File: `supabase/migrations/015_add_rewards_tables.sql`**\n\n```sql\n-- ============================================================\n-- 015: Rewards Store Tables, RLS, RPCs\n-- ============================================================\n\n-- rewards table\nCREATE TABLE rewards (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  family_id uuid NOT NULL REFERENCES families(id) ON DELETE CASCADE,\n  title text NOT NULL CHECK (char_length(title) <= 200),\n  description text,\n  points_cost integer NOT NULL CHECK (points_cost >= 1),\n  icon_id text NOT NULL DEFAULT 'star',\n  category text NOT NULL DEFAULT 'other',\n  stock integer CHECK (stock IS NULL OR stock >= 1),\n  active boolean NOT NULL DEFAULT true,\n  created_by uuid NOT NULL REFERENCES profiles(id),\n  created_at timestamptz NOT NULL DEFAULT now(),\n  updated_at timestamptz NOT NULL DEFAULT now()\n);\n\n-- reward_redemptions table\nCREATE TABLE reward_redemptions (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  reward_id uuid NOT NULL REFERENCES rewards(id) ON DELETE RESTRICT,\n  redeemed_by uuid NOT NULL REFERENCES profiles(id),\n  points_cost integer NOT NULL,\n  status text NOT NULL DEFAULT 'pending' CHECK (status IN ('pending', 'approved', 'rejected')),\n  redeemed_at timestamptz NOT NULL DEFAULT now(),\n  resolved_at timestamptz,\n  resolved_by uuid REFERENCES profiles(id)\n);\n\n-- Indexes\nCREATE INDEX idx_rewards_family_active ON rewards(family_id, active) WHERE active = true;\nCREATE INDEX idx_rewards_family_id ON rewards(family_id);\nCREATE INDEX idx_redemptions_redeemed_by_status ON reward_redemptions(redeemed_by, status);\nCREATE INDEX idx_redemptions_status ON reward_redemptions(status) WHERE status = 'pending';\nCREATE INDEX idx_redemptions_reward_id ON reward_redemptions(reward_id);\n\n-- updated_at trigger for rewards\nCREATE OR REPLACE FUNCTION set_rewards_updated_at()\nRETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  NEW.updated_at = now();\n  RETURN NEW;\nEND;\n$$;\n\nCREATE TRIGGER rewards_updated_at\n  BEFORE UPDATE ON rewards\n  FOR EACH ROW EXECUTE FUNCTION set_rewards_updated_at();\n\n-- ============================================================\n-- RLS: rewards\n-- ============================================================\nALTER TABLE rewards ENABLE ROW LEVEL SECURITY;\n\nCREATE POLICY \"family_members_select_rewards\" ON rewards FOR SELECT\n  USING (family_id IN (SELECT family_id FROM profiles WHERE id = auth.uid()));\n\nCREATE POLICY \"parents_insert_rewards\" ON rewards FOR INSERT\n  WITH CHECK (\n    family_id IN (SELECT family_id FROM profiles WHERE id = auth.uid())\n    AND (SELECT role FROM profiles WHERE id = auth.uid()) = 'parent'\n  );\n\nCREATE POLICY \"parents_update_rewards\" ON rewards FOR UPDATE\n  USING (\n    family_id IN (SELECT family_id FROM profiles WHERE id = auth.uid())\n    AND (SELECT role FROM profiles WHERE id = auth.uid()) = 'parent'\n  );\n\n-- No DELETE: rewards are deactivated, not deleted. Preserves redemption history.\n-- Explicit deny makes intent clear (not a forgotten policy).\nCREATE POLICY \"no_delete_rewards\" ON rewards FOR DELETE USING (false);\n\n-- ============================================================\n-- RLS: reward_redemptions\n-- ============================================================\nALTER TABLE reward_redemptions ENABLE ROW LEVEL SECURITY;\n\n-- Users see their own redemptions; parents see all family redemptions\nCREATE POLICY \"own_or_family_parent_select_redemptions\" ON reward_redemptions FOR SELECT\n  USING (\n    redeemed_by = auth.uid()\n    OR EXISTS (\n      SELECT 1 FROM profiles p\n      JOIN rewards r ON r.family_id = p.family_id\n      WHERE p.id = auth.uid() AND p.role = 'parent' AND r.id = reward_redemptions.reward_id\n    )\n  );\n\n-- No direct INSERT/UPDATE/DELETE \u2014 handled by SECURITY DEFINER RPCs\nCREATE POLICY \"no_insert_redemptions\" ON reward_redemptions FOR INSERT WITH CHECK (false);\nCREATE POLICY \"no_update_redemptions\" ON reward_redemptions FOR UPDATE USING (false);\nCREATE POLICY \"no_delete_redemptions\" ON reward_redemptions FOR DELETE USING (false);\n\n-- ============================================================\n-- RPC: redeem_reward\n-- ============================================================\nCREATE OR REPLACE FUNCTION redeem_reward(p_user_id uuid, p_reward_id uuid)\nRETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  v_reward rewards%ROWTYPE;\n  v_rows_affected int;\n  v_cost int;\nBEGIN\n  -- Auth: caller must be the authenticated user\n  IF p_user_id != auth.uid() THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Unauthorized');\n  END IF;\n\n  -- Fetch reward\n  SELECT * INTO v_reward FROM rewards WHERE id = p_reward_id;\n\n  IF NOT FOUND THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Reward not found');\n  END IF;\n\n  IF NOT v_reward.active THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Reward is no longer available');\n  END IF;\n\n  -- Auth: must be a child in the same family as the reward\n  IF NOT EXISTS (\n    SELECT 1 FROM profiles\n    WHERE id = p_user_id AND family_id = v_reward.family_id AND role = 'child'\n  ) THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Unauthorized');\n  END IF;\n\n  v_cost := v_reward.points_cost;\n\n  -- Check and decrement stock atomically (if limited)\n  IF v_reward.stock IS NOT NULL THEN\n    UPDATE rewards SET stock = stock - 1\n    WHERE id = p_reward_id AND stock > 0;\n\n    GET DIAGNOSTICS v_rows_affected = ROW_COUNT;\n    IF v_rows_affected = 0 THEN\n      RETURN jsonb_build_object('success', false, 'error', 'Out of stock');\n    END IF;\n  END IF;\n\n  -- Atomic point deduction (only succeeds if user has enough)\n  UPDATE profiles SET points = points - v_cost\n  WHERE id = p_user_id AND points >= v_cost;\n\n  GET DIAGNOSTICS v_rows_affected = ROW_COUNT;\n  IF v_rows_affected = 0 THEN\n    -- Explicit rollback: undo stock decrement\n    -- NOTE: A normal RETURN does NOT rollback prior writes in PL/pgSQL.\n    -- Only RAISE EXCEPTION triggers automatic rollback. We must undo manually.\n    IF v_reward.stock IS NOT NULL THEN\n      UPDATE rewards SET stock = stock + 1 WHERE id = p_reward_id;\n    END IF;\n    RETURN jsonb_build_object('success', false, 'error',\n      'Not enough points (need ' || v_cost || ')');\n  END IF;\n\n  -- Create redemption record with cost snapshot\n  INSERT INTO reward_redemptions (reward_id, redeemed_by, status, points_cost)\n  VALUES (p_reward_id, p_user_id, 'pending', v_cost);\n\n  RETURN jsonb_build_object('success', true, 'points_spent', v_cost);\n\nEXCEPTION WHEN OTHERS THEN\n  -- Unhandled exception: PG auto-rolls back all writes in this transaction.\n  -- Return structured error to honour the client contract.\n  RETURN jsonb_build_object('success', false, 'error', 'Unexpected error. Please try again.');\nEND;\n$$;\n\n-- ============================================================\n-- RPC: resolve_redemption (approve or reject)\n-- ============================================================\nCREATE OR REPLACE FUNCTION resolve_redemption(\n  p_user_id uuid,\n  p_redemption_id uuid,\n  p_action text\n)\nRETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER AS $$\nDECLARE\n  v_redemption reward_redemptions%ROWTYPE;\n  v_reward rewards%ROWTYPE;\n  v_rows_affected int;\nBEGIN\n  -- Auth: caller must be the authenticated user\n  IF p_user_id != auth.uid() THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Unauthorized');\n  END IF;\n\n  -- Validate action\n  IF p_action NOT IN ('approved', 'rejected') THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Invalid action');\n  END IF;\n\n  -- Fetch redemption\n  SELECT * INTO v_redemption FROM reward_redemptions WHERE id = p_redemption_id;\n  IF NOT FOUND THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Redemption not found');\n  END IF;\n\n  IF v_redemption.status != 'pending' THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Already resolved');\n  END IF;\n\n  -- Fetch reward for family check\n  SELECT * INTO v_reward FROM rewards WHERE id = v_redemption.reward_id;\n\n  -- Auth: must be parent in same family\n  IF NOT EXISTS (\n    SELECT 1 FROM profiles\n    WHERE id = p_user_id AND family_id = v_reward.family_id AND role = 'parent'\n  ) THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Unauthorized');\n  END IF;\n\n  -- Update redemption status (WHERE status = 'pending' prevents double-resolution)\n  UPDATE reward_redemptions\n  SET status = p_action, resolved_at = now(), resolved_by = p_user_id\n  WHERE id = p_redemption_id AND status = 'pending';\n\n  GET DIAGNOSTICS v_rows_affected = ROW_COUNT;\n  IF v_rows_affected = 0 THEN\n    RETURN jsonb_build_object('success', false, 'error', 'Already resolved');\n  END IF;\n\n  -- On rejection: refund points (using snapshot cost) and restore stock\n  IF p_action = 'rejected' THEN\n    UPDATE profiles SET points = points + v_redemption.points_cost\n    WHERE id = v_redemption.redeemed_by;\n\n    IF v_reward.stock IS NOT NULL THEN\n      UPDATE rewards SET stock = stock + 1 WHERE id = v_reward.id;\n    END IF;\n  END IF;\n\n  RETURN jsonb_build_object('success', true);\n\nEXCEPTION WHEN OTHERS THEN\n  RETURN jsonb_build_object('success', false, 'error', 'Unexpected error. Please try again.');\nEND;\n$$;\n```\n\n### Error Handling Strategy\n\n| Error Type | Handling |\n|-----------|----------|\n| RPC returns `{ success: false }` | Display `data.error` in inline message or toast |\n| RPC EXCEPTION handler fires | Returns structured `{ success: false, error: \"Unexpected error...\" }` \u2014 client handles same as above |\n| Network failure | try/catch \u2192 \"Something went wrong. Please try again.\" |\n| Delete attempt on reward with history | FK RESTRICT + RLS deny \u2192 show \"Cannot delete. Deactivate instead.\" |\n| Race: two kids redeem last stock | `WHERE stock > 0` \u2192 one succeeds, other gets \"Out of stock\" |\n| Race: two redemptions overdraw points | `WHERE points >= cost` \u2192 one succeeds, other gets \"Not enough points\" |\n| Race: two parents resolve same redemption | `WHERE status = 'pending'` \u2192 one succeeds, other gets \"Already resolved\" |\n\nNo optimistic UI for mutations. All mutations wait for server confirmation before updating UI (correctness over speed). The one exception: active/inactive toggle may use optimistic update for snappier feel, with rollback on error.\n\n## Key Design Decisions\n\n### 1. Combined `resolve_redemption` RPC\n\n- **Decision**: Single RPC with `p_action` parameter for both approve and reject\n- **Source**: Design B\n- **Rationale**: Approve and reject share 80% of their logic (auth, fetch, family check, status update). A single RPC means one auth check path to audit, one place to add EXCEPTION handling, and fewer functions to maintain.\n- **Alternative**: Design A's separate `approve_redemption` + `reject_redemption`. Rejected because the duplication is pure liability \u2014 any fix to one must be mirrored in the other.\n\n### 2. `points_cost` Snapshot on Redemptions\n\n- **Decision**: Store the cost at redemption time on `reward_redemptions.points_cost`\n- **Source**: Design B (original)\n- **Rationale**: If a parent changes a reward's price between redemption and rejection, the refund must use the original charge. This is the standard ledger pattern. One extra integer column eliminates an entire class of silent data integrity bugs.\n- **Alternative**: Refund using live `rewards.points_cost`. Rejected \u2014 produces wrong balances silently.\n\n### 3. `resolved_at` / `resolved_by` (not `approved_at` + `rejected_at`)\n\n- **Decision**: Two columns covering both outcomes, distinguished by `status`\n- **Source**: Design B (refined)\n- **Rationale**: Semantically correct for both actions. `approved_at` on a rejected record is misleading. Two columns instead of four reduces schema noise.\n- **Alternative**: Design A's four columns (`approved_at`, `approved_by`, `rejected_at`, `rejected_by`). Rejected \u2014 redundant with `status` column.\n\n### 4. `ON DELETE RESTRICT` + Explicit Deny Policy\n\n- **Decision**: FK prevents deletion at DB level; RLS `USING(false)` makes intent explicit\n- **Source**: Merged (A's RESTRICT + B's explicit deny)\n- **Rationale**: Redemption records are a financial audit trail. Rewards with any history cannot be deleted. Parents deactivate instead. The explicit deny policy prevents future migrations from accidentally adding a permissive DELETE.\n- **Alternative**: Design A's conditional delete (allowed if no pending redemptions). Rejected \u2014 approved/rejected history would still be lost.\n\n### 5. No Category CHECK Constraint\n\n- **Decision**: Validate categories at app level via `REWARD_CATEGORIES` constant, not in DB\n- **Source**: Design A (refined)\n- **Rationale**: Adding a new category should not require a DB migration. The project's non-standard migration naming makes migrations disproportionately costly. RLS ensures only parents can insert, and the form enforces valid categories.\n- **Alternative**: DB CHECK constraint. Rejected \u2014 migration cost exceeds the risk of an out-of-band invalid category.\n\n### 6. Children-Only Redemption\n\n- **Decision**: `redeem_reward` RPC requires `role = 'child'`\n- **Source**: Both designs (refined)\n- **Rationale**: The approval workflow assumes redeemer \u2260 approver. Parent self-redemption creates an undefined self-approval loop. The app's core model is \"kids earn, parents reward.\" Blocking parent redemption at DB level is correct and simpler than specifying self-approval rules.\n- **Alternative**: Allow parent redemption with auto-approve. Rejected \u2014 out of scope, can be added later with a separate RPC.\n\n### 7. EXCEPTION Handlers in RPCs\n\n- **Decision**: Both RPCs include `EXCEPTION WHEN OTHERS` blocks\n- **Source**: Design B (refined)\n- **Rationale**: The client always expects `{ success: boolean, error?: string }`. Without EXCEPTION handling, unexpected DB errors surface as raw Supabase error objects, breaking the UI's error display. The EXCEPTION block also triggers automatic transaction rollback, providing a safety net for the multi-write RPCs.\n- **Alternative**: No EXCEPTION handlers (Design A, existing `buy_streak_freeze` pattern). Rejected \u2014 the reward RPCs do 2-3 writes per call, increasing the surface area for mid-transaction failures compared to `buy_streak_freeze`'s single UPDATE.\n\n## How This Improves Current Architecture\n\n| Current Weakness | How This Plan Addresses It | Remaining Risk |\n|-----------------|---------------------------|----------------|\n| \"Coming Soon\" stub on rewards page \u2014 no rewards functionality | Full rewards store with CRUD, redemption, and approval workflows | None \u2014 this is the core feature |\n| No atomic multi-table write pattern beyond `buy_streak_freeze` | Two new RPCs (`redeem_reward`, `resolve_redemption`) establish a reusable pattern for atomic multi-table writes with EXCEPTION handling | None |\n| Points are earn-only; no spending mechanism | Redemption deducts points atomically, completing the earn-spend loop | Points \"locked\" while pending \u2014 mitigated by pending display |\n| No parent-child interaction beyond task assignment | Approval workflow creates meaningful parent-child interaction around rewards | None |\n| Existing `buy_streak_freeze` lacks EXCEPTION handler | New RPCs include EXCEPTION handling as a pattern; `buy_streak_freeze` could be updated separately | `buy_streak_freeze` still lacks EXCEPTION handler \u2014 low risk (single UPDATE) |\n| No `updated_at` on any feature table | `rewards` table includes `updated_at` with auto-trigger, establishing pattern | Not added retroactively to existing tables |\n\n## Implementation Strategy\n\n### Phase 1: Data Layer\n\n**Files:**\n\n| File | Action |\n|------|--------|\n| `supabase/migrations/015_add_rewards_tables.sql` | Create |\n| `lib/types.ts` | Modify \u2014 add Reward, RewardRedemption types, RPC signatures, constants |\n\nRun migration via Management API before proceeding. Verify tables exist and RPCs are callable.\n\n### Phase 2: Components (can be parallelized)\n\n**Files:**\n\n| File | Action | Test File |\n|------|--------|-----------|\n| `components/rewards/reward-card.tsx` | Create | `__tests__/components/rewards/reward-card.test.tsx` |\n| `components/rewards/reward-form.tsx` | Create | `__tests__/components/rewards/reward-form.test.tsx` |\n| `components/rewards/redeem-confirm-modal.tsx` | Create | `__tests__/components/rewards/redeem-confirm-modal.test.tsx` |\n| `components/rewards/reward-store.tsx` | Create | `__tests__/components/rewards/reward-store.test.tsx` |\n| `components/rewards/redemption-history.tsx` | Create | `__tests__/components/rewards/redemption-history.test.tsx` |\n| `components/rewards/manage-rewards.tsx` | Create | `__tests__/components/rewards/manage-rewards.test.tsx` |\n| `components/rewards/approval-queue.tsx` | Create | `__tests__/components/rewards/approval-queue.test.tsx` |\n\nBuild order (if sequential): `reward-card` \u2192 `reward-store`, `manage-rewards` (both compose cards) \u2192 `reward-form`, `redeem-confirm-modal` \u2192 `approval-queue`, `redemption-history`.\n\n### Phase 3: Page Integration\n\n**Files:**\n\n| File | Action |\n|------|--------|\n| `app/(dashboard)/rewards/page.tsx` | Modify \u2014 replace \"Coming Soon\" stub with tabbed UI using `useSearchParams` |\n\nPage changes:\n- Add tab bar below leaderboard: Store, My Rewards, Manage (parent), Approvals (parent + badge)\n- Add state management: rewards, redemptions, pending count, active tab via URL\n- Add data fetching: `fetchRewards()`, `fetchRedemptions()`, `fetchProfile()`, `fetchPendingPointsCost()`\n- Add mutation handlers: `handleRedeem`, `handleApprove`, `handleReject`, `handleCreateReward`, `handleUpdateReward`, `handleToggleActive`\n- Add pending points display below points balance\n- Wire all components with props and callbacks\n\n### Phase 4: Tests\n\n**Files:**\n\n| File | Action |\n|------|--------|\n| `__tests__/db/rewards.test.ts` | Create \u2014 DB integration tests for RPCs |\n| `e2e/rewards-store.spec.ts` | Create \u2014 E2E for store, redemption, approval |\n| `e2e/rewards.spec.ts` | Modify \u2014 update \"Coming Soon\" test |\n| `playwright.config.ts` | Modify \u2014 add `rewards-store\\.spec\\.ts` to testMatch |\n| `e2e/global-teardown.ts` | Modify \u2014 add rewards/redemptions cleanup |\n\n**DB integration tests (`__tests__/db/rewards.test.ts`):**\n- `redeem_reward`: happy path, insufficient points, out of stock, inactive reward, wrong family, parent blocked\n- `resolve_redemption`: approve happy path, reject with refund + stock restore, already resolved, wrong family, child blocked\n\n**E2E tests (`e2e/rewards-store.spec.ts`):**\n- Parent creates a reward (form fill, verify appears in store)\n- Child browses store, sees reward with correct cost\n- Child redeems reward (confirmation modal, points deducted, pending status)\n- Parent approves redemption (queue shows item, approve, item gone)\n- Parent creates and then deactivates a reward (toggle, verify hidden from store)\n\n**E2E teardown addition:**\n```typescript\n// In e2e/global-teardown.ts \u2014 delete redemptions first (RESTRICT FK), then rewards\nawait runSQL(`\n  DELETE FROM reward_redemptions rr\n  USING rewards r, profiles p\n  WHERE rr.reward_id = r.id\n    AND r.family_id = p.family_id\n    AND p.email IN ('[REDACTED]');\n\n  DELETE FROM rewards r\n  USING profiles p\n  WHERE r.family_id = p.family_id\n    AND p.email IN ('[REDACTED]');\n`)\n```\n\n### Ordering Constraints\n\n```\nPhase 1 (Data Layer) \u2192 Phase 2 (Components) \u2192 Phase 3 (Page) \u2192 Phase 4 (Tests)\n                        \u2191 Components parallelizable within phase\n```\n\n### Rollback Strategy\n\n- **Migration rollback**: Drop tables in reverse order (`reward_redemptions` first, then `rewards`). Drop RPCs and trigger function. No existing tables are modified.\n- **Code rollback**: Revert to \"Coming Soon\" stub. No other files depend on the new components.\n- **Partial rollback**: If RPCs need fixing after deployment, `CREATE OR REPLACE FUNCTION` updates them in-place without data loss.\n\n## Complete File Summary\n\n| File | Action | Phase |\n|------|--------|-------|\n| `supabase/migrations/015_add_rewards_tables.sql` | Create | 1 |\n| `lib/types.ts` | Modify | 1 |\n| `components/rewards/reward-card.tsx` | Create | 2 |\n| `components/rewards/reward-form.tsx` | Create | 2 |\n| `components/rewards/redeem-confirm-modal.tsx` | Create | 2 |\n| `components/rewards/reward-store.tsx` | Create | 2 |\n| `components/rewards/redemption-history.tsx` | Create | 2 |\n| `components/rewards/manage-rewards.tsx` | Create | 2 |\n| `components/rewards/approval-queue.tsx` | Create | 2 |\n| `__tests__/components/rewards/reward-card.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/reward-form.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/redeem-confirm-modal.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/reward-store.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/redemption-history.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/manage-rewards.test.tsx` | Create | 2 |\n| `__tests__/components/rewards/approval-queue.test.tsx` | Create | 2 |\n| `app/(dashboard)/rewards/page.tsx` | Modify | 3 |\n| `__tests__/db/rewards.test.ts` | Create | 4 |\n| `e2e/rewards-store.spec.ts` | Create | 4 |\n| `e2e/rewards.spec.ts` | Modify | 4 |\n| `playwright.config.ts` | Modify | 4 |\n| `e2e/global-teardown.ts` | Modify | 4 |\n\n## Risk Mitigation\n\n| Risk | Likelihood | Impact | Mitigation |\n|------|-----------|--------|------------|\n| Migration `015_` naming collision with another feature branch | Medium | Low | Use dedicated feature branch; renumber if collision detected |\n| Points display staleness across devices | Low | Low | Acceptable for MVP; add Supabase Realtime subscription later |\n| Large redemption history for active kids | Low | Low | Paginated at 20 items with \"Load more\"; sufficient for years of use |\n| Category rigidity (5 fixed values) | Medium | Low | No DB CHECK \u2014 adding a category is a code change only (update constant) |\n| Stock at 0 after all redeemed but reward not deactivated | Medium | Low | Card shows \"Out of stock\" (disabled); parent can restock by editing |\n| `buy_streak_freeze` inconsistency (no EXCEPTION handler) | Low | Low | Different risk profile (single UPDATE); can be updated independently |\n\n### Monitor After Deployment\n\n- Points balance correctness: spot-check that `sum(points_earned) - sum(redemption points_cost where status != 'rejected')` matches `profiles.points` for test users\n- RPC error rates: check Supabase logs for unexpected `EXCEPTION WHEN OTHERS` hits\n- Pending redemption queue: ensure approvals/rejections are flowing (no stuck pending items)\n\n### Decision Points to Reconsider\n\n- If families accumulate > 50 rewards: add server-side pagination for rewards list\n- If real-time updates are requested: add Supabase Realtime subscription for `reward_redemptions` changes\n- If parents request self-redemption: create separate `redeem_reward_parent` RPC with auto-approve\n\n## Success Metrics\n\n### Leading Indicators (during implementation)\n\n- All RPCs pass DB integration tests (atomic deduction, refund, race conditions)\n- 100% unit test coverage on all new components\n- E2E tests pass for create \u2192 redeem \u2192 approve flow\n- No TypeScript errors with strict mode\n\n### Lagging Indicators (after deployment)\n\n- \"Coming Soon\" stub replaced \u2014 rewards page is functional\n- Parents are creating rewards (\u2265 1 reward per active family within first week)\n- Kids are redeeming rewards (\u2265 1 redemption per active family within first two weeks)\n- Zero point balance discrepancies reported\n- No cross-family data leakage in Supabase logs\n",
