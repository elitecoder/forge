    "plan_summary": "# Final Plan: Observability Dashboard (Issue #78)\n\n## Executive Summary\n\nAdd a password-protected admin observability dashboard at `/admin/observability` that provides real-time visibility into application health, errors, performance, and usage analytics. The system introduces two new database tables (`app_errors`, `app_events`), fire-and-forget instrumentation wrappers around Supabase calls and API routes, React Error Boundaries, and a Recharts-powered dashboard with 30-second auto-refresh. The key architectural insight is that observability must be invisible to users: all logging is fire-and-forget via `void` promises, uses a service-role client bypassing RLS, and never blocks the request path \u2014 while the dashboard itself is a fully client-side component fetching from admin-only API routes protected by HMAC-signed session cookies.\n\n---\n\n## Problem Analysis\n\n### Functional Requirements\n\n1. **Health at a Glance** \u2014 Supabase connection status, API latency per route, error rate trend, active user count, logging pipeline health\n2. **Error Tracking** \u2014 Capture errors from Supabase calls, API routes, and React Error Boundaries; display recent errors, frequency by route, top failures\n3. **Performance Metrics** \u2014 API route request duration, Supabase RPC timing, latency trends (CWV deferred to Vercel Analytics)\n4. **Usage Analytics** \u2014 DAU chart, most/least completed chores, peak usage hours, AI API call volume, event counts by type\n5. **Admin Auth** \u2014 Password-protected access via cookie-based session, independent of Supabase auth\n6. **Event Tracking** \u2014 Log key user actions (task completed, reward claimed, family joined, streak milestone, AI operations)\n\n### Non-Functional Requirements\n\n- Instrumentation adds < 5ms overhead to any request (fire-and-forget, never awaited)\n- Dashboard loads within 2 seconds\n- Error/event logging never blocks user operations\n- No sensitive data (passwords, tokens) stored in error/event metadata\n- 100% unit test coverage on new code\n- DB integration tests for new RPCs\n- E2E test for admin dashboard\n\n### Constraints\n\n- **Tech stack**: Next.js 16 (App Router), React 19, Supabase, Tailwind v4, Recharts (already installed)\n- **Middleware**: Runs on Edge Runtime \u2014 no Node.js `crypto`, must use Web Crypto API\n- **Migrations**: Sequential naming (`014_`), run via Management API (not `supabase db push`)\n- **Vercel Analytics**: Already integrated \u2014 do not duplicate page view or Core Web Vitals tracking\n- **Deployment**: Likely serverless (Vercel) \u2014 no persistent in-memory state between requests\n\n### Priority Ordering\n\n1. **Security** \u2014 Admin data must not leak to regular users (REVOKE on RPCs, RLS, session auth)\n2. **Reliability** \u2014 Logging must never break the app (fire-and-forget, no FKs on log tables)\n3. **Completeness** \u2014 Instrument all RPCs and key user actions, not just AI routes\n4. **Usability** \u2014 Dashboard should auto-refresh and show per-panel errors gracefully\n5. **Maintainability** \u2014 App-level event type validation (no CHECK constraints), cleanup tooling\n\n---\n\n## Design Comparison\n\n### 1. Data Model\n\n**Design A**: Uses JSONB `metadata` for `duration_ms` and `route` in `app_events`. Adds expression indexes on JSONB paths in refinement. Keeps FK constraints (ON DELETE SET NULL).\n\n**Design B**: Adds a dedicated `duration_ms` integer column, `error_code` and `method` columns on `app_errors`. Removes FK constraints in refinement for consistency with fire-and-forget philosophy.\n\n**Selected**: Design B's data model \u2014 dedicated `duration_ms` column avoids JSONB extraction overhead for the most common aggregation query. No FK constraints on log tables. Design A's expression indexes on JSONB paths are still needed for `metadata->>'route'` and `metadata->>'rpcName'` grouping.\n\n### 2. Security \u2014 RPC Access Control\n\n**Design A**: Uses `SECURITY DEFINER` RPCs but does not address that these bypass RLS. No REVOKE statements.\n\n**Design B (refined)**: Adds explicit `REVOKE EXECUTE FROM PUBLIC/authenticated/anon` after each RPC. This is the correct PostgreSQL mechanism.\n\n**Selected**: Design B \u2014 this is a critical security fix. Without REVOKE, any browser client could call the RPCs and dump all observability data.\n\n### 3. Admin Authentication\n\n**Design A (refined)**: Separates `ADMIN_SESSION_SECRET` from `ADMIN_OBSERVABILITY_PASSWORD`. Uses Web Crypto API for Edge Runtime compatibility. Adds logout Server Action.\n\n**Design B (refined)**: Same separation, plus session versioning (HMAC of password embedded in token) so changing the password immediately invalidates all sessions.\n\n**Selected**: Merge \u2014 Use Design A's Web Crypto API implementation (Edge-compatible) with Design B's session versioning concept. Both designs agree on separate signing key.\n\n### 4. API Structure\n\n**Design A**: Single `POST /api/observability/ingest` endpoint accepting errors, events, and batches. Dashboard data fetched directly via RPCs in Server Component.\n\n**Design B**: Separate `POST /api/observability/errors` and `POST /api/observability/events` endpoints. Dashboard data via REST API routes (`GET /api/admin/observability/*`). Client-side dashboard with auto-refresh.\n\n**Selected**: Merge \u2014 Use Design A's single ingest endpoint for client-side simplicity (one endpoint to call from Error Boundaries, web vitals, etc.). Use Design B's admin API routes pattern for dashboard data (enables client-side auto-refresh). Design B's auto-refresh (30s) is more practical for an observability dashboard than Design A's manual refresh.\n\n### 5. CWV and Page Views\n\n**Design A (refined)**: Keeps `web_vital` and `page_view` event types. Adds `web-vitals` dependency. Implements `PageViewTracker` component.\n\n**Design B (refined)**: Removes `web_vital` and `page_view` entirely, deferring to Vercel Analytics.\n\n**Selected**: Compromise \u2014 Remove `web_vital` (Vercel Analytics handles this better). Keep `page_view` for accurate DAU counting using Design A's `PageViewTracker` component. No `web-vitals` dependency needed.\n\n### 6. Event Type Validation\n\n**Design A**: Keeps CHECK constraints on `app_events.event_type`.\n\n**Design B (refined)**: Drops CHECK constraint, validates at app layer via TypeScript union + runtime check in `constants.ts`.\n\n**Selected**: Design B \u2014 app-level validation is more flexible and avoids migration pain when adding new event types.\n\n### 7. Rate Limiting\n\n**Design A**: In-memory rate limiter (resets on deploy).\n\n**Design B (refined)**: Database-backed rate limiting for admin auth via `admin_auth_attempts` table.\n\n**Selected**: Design B for admin auth (brute-force protection that works on serverless). For the ingest endpoint, use Design A's payload caps (8KB limit, 20-item batch cap) plus an ingest token header as deterrent \u2014 no per-request DB lookup needed for logging.\n\n### 8. Middleware Timing\n\n**Both designs**: Converge on `x-request-start` header approach \u2014 middleware sets timestamp, API routes compute duration.\n\n**Selected**: The converged approach. Design A's refinement (scoping Performance panel to \"API Route Latency\" explicitly) is honest and correct. Design B's refinement (using `new NextRequest()` for header propagation) is the correct implementation.\n\n### 9. Fire-and-Forget Implementation\n\n**Design A**: Uses `void logEvent(...)` pattern from the start.\n\n**Design B (refined)**: Fixed `withObservability` to use `void` instead of `await` \u2014 critical fix.\n\n**Selected**: Both converge on `void` pattern. Design B's `withObservability` wrapper is a cleaner API for instrumenting routes.\n\n### 10. Logging Pipeline Health\n\n**Design A (refined)**: Health endpoint does probe insert + immediate delete to verify write path works.\n\n**Design B**: No equivalent.\n\n**Selected**: Design A \u2014 the health probe is essential. Without it, \"no errors\" is indistinguishable from \"logging is broken.\"\n\n### 11. Data Cleanup\n\n**Design A (refined)**: Adds `cleanup_old_observability_data()` RPC in migration with admin dashboard button.\n\n**Design B**: Mentions 90-day retention but defers implementation.\n\n**Selected**: Design A \u2014 cleanup RPC in migration, admin-triggered via dashboard button.\n\n---\n\n## Synthesized Architecture\n\n### Component Architecture\n\n```\n+--------------------------------------------------------------+\n|                    Browser (Client)                            |\n|                                                               |\n|  +----------------+  +------------------+  +---------------+  |\n|  | ErrorBoundary  |  | PageViewTracker  |  | Event calls   |  |\n|  | (React class)  |  | (usePathname)    |  | (logEvent())  |  |\n|  +-------+--------+  +--------+---------+  +-------+-------+  |\n|          |                     |                    |          |\n|          +----------+----------+--------------------+          |\n|                     v                                          |\n|          POST /api/observability/ingest                        |\n|          (x-obs-token header)                                  |\n+----------------------------+-----------------------------------+\n                             |\n+----------------------------v-----------------------------------+\n|                    Server                                      |\n|                                                                |\n|  +------------------+  +---------------------------------+     |\n|  | middleware.ts     |  | API Routes                      |    |\n|  | (sets x-request-  |  | withObservability() wrapper     |    |\n|  |  start-ms header, |  | - Computes duration from header |    |\n|  |  admin auth check)|  | - void trackEvent() on complete |    |\n|  +------------------+  | - void logError() on error       |    |\n|                        +---------------------------------+     |\n|                                                                |\n|  +--------------------------------------------------+         |\n|  | lib/observability/                                |         |\n|  | +-- error-logger.ts   (logError \u2192 app_errors)     |         |\n|  | +-- event-tracker.ts  (trackEvent \u2192 app_events)   |         |\n|  | +-- instrumented-client.ts (timedRpc wrapper)     |         |\n|  | +-- admin-auth.ts    (SubtleCrypto HMAC sessions) |         |\n|  | +-- constants.ts     (event/error type enums)     |         |\n|  | +-- ingest-validation.ts (payload validation)     |         |\n|  | +-- server-timing.ts (getRequestStartMs helper)   |         |\n|  | +-- cleanup.ts       (retention cleanup wrapper)  |         |\n|  +--------------------------------------------------+         |\n|                         |                                      |\n|              +----------v-----------+                          |\n|              | Supabase (service    |                          |\n|              | role client)         |                          |\n|              | +-- app_errors       |                          |\n|              | +-- app_events       |                          |\n|              | +-- admin_auth_attempts                         |\n|              +--------------------------+                      |\n|                                                                |\n|  +--------------------------------------------------+         |\n|  | /admin/observability (client component)           |         |\n|  | +-- Login page (password form)                    |         |\n|  | +-- Dashboard (4 panels, auto-refresh 30s)        |         |\n|  |     +-- Health Panel (status, latency, errors)    |         |\n|  |     +-- Error Panel (table, bar chart, top 5)     |         |\n|  |     +-- Performance Panel (route/RPC timing)      |         |\n|  |     +-- Usage Panel (DAU, chores, peak hours, AI) |         |\n|  +--------------------------------------------------+         |\n+----------------------------------------------------------------+\n```\n\n### Data Model\n\n#### `app_errors` table\n\n```sql\nCREATE TABLE IF NOT EXISTS app_errors (\n  id            uuid        PRIMARY KEY DEFAULT gen_random_uuid(),\n  error_message text        NOT NULL,\n  error_type    text        NOT NULL CHECK (error_type IN ('rpc', 'api', 'client', 'boundary', 'middleware')),\n  error_code    text,\n  route         text        NOT NULL,\n  method        text,\n  user_id       uuid,       -- no FK: logging must never fail due to referential violations\n  metadata      jsonb       DEFAULT '{}'::jsonb,\n  created_at    timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX idx_app_errors_created_at ON app_errors (created_at DESC);\nCREATE INDEX idx_app_errors_route ON app_errors (route);\nCREATE INDEX idx_app_errors_error_type ON app_errors (error_type);\n\nALTER TABLE app_errors ENABLE ROW LEVEL SECURITY;\n-- No RLS policies = only service_role can access\n```\n\n#### `app_events` table\n\n```sql\nCREATE TABLE IF NOT EXISTS app_events (\n  id          uuid        PRIMARY KEY DEFAULT gen_random_uuid(),\n  event_type  text        NOT NULL,  -- validated at app layer, no CHECK constraint\n  user_id     uuid,                  -- no FK\n  family_id   uuid,                  -- no FK\n  metadata    jsonb       DEFAULT '{}'::jsonb,\n  duration_ms integer,               -- dedicated column for performance queries\n  created_at  timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX idx_app_events_created_at ON app_events (created_at DESC);\nCREATE INDEX idx_app_events_event_type ON app_events (event_type);\nCREATE INDEX idx_app_events_user_id ON app_events (user_id);\nCREATE INDEX idx_app_events_type_created ON app_events (event_type, created_at DESC);\n\n-- Expression indexes for performance queries on JSONB paths\nCREATE INDEX idx_app_events_api_route\n  ON app_events ((metadata->>'route'))\n  WHERE event_type = 'api_request';\n\nCREATE INDEX idx_app_events_rpc_name\n  ON app_events ((metadata->>'rpcName'))\n  WHERE event_type = 'rpc_call';\n\nALTER TABLE app_events ENABLE ROW LEVEL SECURITY;\n-- No RLS policies = only service_role can access\n```\n\n#### `admin_auth_attempts` table (rate limiting)\n\n```sql\nCREATE TABLE IF NOT EXISTS admin_auth_attempts (\n  id           uuid        PRIMARY KEY DEFAULT gen_random_uuid(),\n  ip_hash      text        NOT NULL,\n  attempted_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE INDEX idx_admin_auth_attempts_ip_recent\n  ON admin_auth_attempts (ip_hash, attempted_at DESC);\n\nALTER TABLE admin_auth_attempts ENABLE ROW LEVEL SECURITY;\n```\n\n#### Event Types (app-level, not DB constraint)\n\n```typescript\n// lib/observability/constants.ts\nexport const APP_EVENT_TYPES = [\n  'task_completed',\n  'reward_claimed',\n  'family_joined',\n  'streak_milestone',\n  'ai_insight_generated',\n  'ai_encouragement_generated',\n  'ai_quest_parsed',\n  'api_request',\n  'rpc_call',\n  'page_view',\n  'health_probe',\n] as const\n\nexport type AppEventType = typeof APP_EVENT_TYPES[number]\n\nexport const APP_ERROR_TYPES = ['rpc', 'api', 'client', 'boundary', 'middleware'] as const\nexport type AppErrorType = typeof APP_ERROR_TYPES[number]\n```\n\n#### RPC Functions\n\nAll RPCs are `SECURITY DEFINER` with explicit `REVOKE EXECUTE FROM PUBLIC/authenticated/anon` after each definition.\n\n**`get_observability_summary(p_range_hours integer DEFAULT 24)`** \u2014 Returns: `{ error_count, active_users, avg_latency_ms, error_rate_trend[], top_errors[], route_latency[] }`. Uses `percentile_cont(0.95)` for p95 latency. `LIMIT 720` on time-series to cap 30-day hourly buckets. Uses `to_char()` for ISO 8601 timestamp strings.\n\n**`get_recent_errors(p_limit integer DEFAULT 20, p_offset integer DEFAULT 0, p_type text DEFAULT NULL, p_range_hours integer DEFAULT 24)`** \u2014 Returns: `{ errors[], total, page, total_pages }`. Supports pagination and type filtering.\n\n**`get_performance_metrics(p_range_hours integer DEFAULT 24)`** \u2014 Returns: `{ route_latency[], rpc_timing[], latency_trend[] }`. Uses `duration_ms` column directly (not JSONB extraction). Groups by `metadata->>'route'` and `metadata->>'rpcName'`. `LIMIT 720` on latency_trend.\n\n**`get_usage_analytics(p_range_days integer DEFAULT 7)`** \u2014 Returns: `{ daily_active_users[], top_chores[], least_chores[], peak_hours[], ai_call_volume[], event_counts }`. Uses `jsonb_object_agg` for event_counts. Labels \"Least Completed\" (not \"Least Popular\") since zero-completion tasks are invisible.\n\n**`cleanup_old_observability_data(p_days integer DEFAULT 90)`** \u2014 Deletes records older than N days from both tables. Returns `{ errors_deleted, events_deleted, cutoff }`.\n\n### API Specifications\n\n#### `POST /api/observability/ingest`\n\nClient-side error, event, and batch ingestion. No auth required (errors happen for unauthenticated users). Protected by:\n- `x-obs-token` header (matches `NEXT_PUBLIC_OBSERVABILITY_INGEST_TOKEN` env var)\n- 8KB payload size cap\n- 20-item batch size cap\n\n```typescript\n// Request\ntype IngestPayload =\n  | { type: 'error'; data: { error_message: string; error_type: AppErrorType; route: string; metadata?: Record<string, unknown> } }\n  | { type: 'event'; data: { event_type: AppEventType; metadata?: Record<string, unknown>; duration_ms?: number } }\n  | { type: 'batch'; items: Array<{ type: 'error' | 'event'; data: ... }> }\n\n// Response: 200 { ok: true } | 400 { error: string } | 403 { error: 'Forbidden' } | 413 { error: 'Payload too large' }\n```\n\nMetadata sanitization: allowlist-based (`ALLOWED_METADATA_KEYS`), 10KB cap per metadata object. Unknown keys stripped.\n\n#### `POST /api/admin/auth`\n\nAdmin login. Rate-limited via `admin_auth_attempts` table (5 per minute per IP hash).\n\n```typescript\n// Request: { [REDACTED] }\n// Response: 200 { success: true } (sets admin_obs_session cookie) | 401 { error: 'Invalid password' } | 429 { error: 'Too many attempts' }\n```\n\nPassword compared with timing-safe comparison. Session is HMAC-SHA256 signed token (Web Crypto API) containing `{ exp, v }` where `v` is a version derived from HMAC(secret, password) \u2014 changing the password invalidates all sessions.\n\n#### `POST /api/admin/logout`\n\nClears admin session cookie. Returns `200 { success: true }`.\n\n#### `GET /api/admin/observability/summary?range=24h|7d|30d`\n\nDashboard overview data. Requires admin session cookie. Calls `get_observability_summary` RPC + Supabase health probe.\n\n#### `GET /api/admin/observability/errors?page=1&limit=20&type=...&range=24h|7d|30d`\n\nPaginated error list. Requires admin session cookie.\n\n#### `GET /api/admin/observability/performance?range=24h|7d|30d`\n\nRoute latency and RPC timing. Requires admin session cookie. Links to Vercel Analytics for Web Vitals.\n\n#### `GET /api/admin/observability/usage?range=7d|30d|90d`\n\nUsage analytics. Requires admin session cookie.\n\n#### `GET /api/observability/health`\n\nQuick health check including logging pipeline probe. Requires admin session cookie. Returns `{ supabase, logging_pipeline, timestamp }`.\n\n### Admin Auth Flow\n\n```\nGET /admin/observability \u2192 middleware checks admin_obs_session cookie\n  \u2192 Invalid/missing \u2192 redirect to /admin/observability/login\n  \u2192 Valid \u2192 allow through\n\nLogin page \u2192 submit password \u2192 POST /api/admin/auth\n  \u2192 Rate limit check (admin_auth_attempts table, 5/min/IP)\n  \u2192 Timing-safe password compare\n  \u2192 Success \u2192 HMAC-sign { exp: 24h, v: version } with ADMIN_SESSION_SECRET via SubtleCrypto\n  \u2192 Set admin_obs_session httpOnly cookie (SameSite=Strict, 24h maxAge)\n  \u2192 Redirect to /admin/observability\n```\n\nAll crypto uses Web Crypto API (SubtleCrypto) \u2014 Edge Runtime compatible.\n\n### Instrumentation Design\n\n#### Server-Side Logging\n\n```typescript\n// lib/observability/error-logger.ts\nfunction logError(params: LogErrorParams): void  // fire-and-forget, never throws\n// Uses service-role Supabase client. Catches all errors internally (console.warn in dev).\n\n// lib/observability/event-tracker.ts\nfunction trackEvent(params: TrackEventParams): void  // fire-and-forget\n// Uses service-role Supabase client. Catches all errors internally.\n```\n\n#### Supabase RPC Wrapper\n\n```typescript\n// lib/observability/instrumented-client.ts\nasync function instrumentedRpc<T>(\n  supabase: SupabaseClient,\n  rpcName: string,\n  args: Record<string, unknown>,\n  context: { route: string; userId?: string }\n): Promise<{ data: T | null; error: PostgrestError | null; durationMs: number }>\n// Measures duration, void logError on error, void trackEvent('rpc_call') always.\n// Returns original { data, error } plus durationMs \u2014 non-breaking addition.\n```\n\nAll 9 existing RPCs are wrapped: `get_family_analytics`, `get_kid_analytics`, `get_kid_heatmap`, `get_user_streaks`, `buy_streak_freeze`, `use_streak_freeze`, `claim_streak_milestone`, `accept_family_invite`, `find_user_by_email`.\n\n#### API Route Wrapper\n\n```typescript\n// lib/observability/middleware-timing.ts\nfunction withObservability(handler: RouteHandler): RouteHandler\n// Reads x-request-start-ms header, computes duration, void trackEvent('api_request').\n// On error: void logError() then re-throw.\n```\n\nApplied to all 3 AI API routes + any future API routes.\n\n#### Middleware Timing\n\n```typescript\n// middleware.ts \u2014 add x-request-start-ms header before updateSession\nconst requestWithTiming = new NextRequest(request, {\n  headers: { ...Object.fromEntries(request.headers.entries()), 'x-request-start-ms': Date.now().toString() }\n})\nreturn await updateSession(requestWithTiming)\n```\n\nAlso: check `admin_obs_session` cookie for `/admin/observability` paths (except `/admin/observability/login`).\n\n#### React Error Boundary\n\n```typescript\n// components/error-boundary.tsx\nclass ObservabilityErrorBoundary extends React.Component {\n  componentDidCatch(error, errorInfo) {\n    // POST to /api/observability/ingest with error details\n    // Truncate componentStack to 500 chars\n  }\n  render() {\n    if (this.state.hasError) return <ErrorFallback onRetry={...} />\n    return this.props.children\n  }\n}\n```\n\nWrapped around children in `app/(dashboard)/layout.tsx`.\n\n#### Page View Tracker\n\n```typescript\n// components/page-view-tracker.tsx\n'use client'\n// Uses usePathname() to detect route changes\n// Fires logEvent({ event_type: 'page_view', metadata: { path } }) once per navigation\n// Deduplicates via lastPathRef\n```\n\nAdded to `app/(dashboard)/layout.tsx` for DAU tracking.\n\n#### Event Tracking Call Sites\n\n| Event | Location | Metadata |\n|-------|----------|----------|\n| `task_completed` | Quest completion handler | `{ taskName, points }` |\n| `reward_claimed` | Reward claim handler | `{ rewardName, cost }` |\n| `family_joined` | Family invite acceptance | `{ familyId }` |\n| `streak_milestone` | Streak milestone claim response | `{ streakType, days, badge }` |\n| `ai_insight_generated` | analytics-insights API route | `{ role }` |\n| `ai_encouragement_generated` | encouragement API route | `{ taskName }` |\n| `ai_quest_parsed` | parse-quest API route | `{}` |\n\n### Dashboard UI\n\n#### Layout\n\n`app/admin/observability/layout.tsx` \u2014 Minimal chrome, no standard nav, includes `<Toaster />` from Sonner.\n\n#### Login Page\n\n`app/admin/observability/login/page.tsx` \u2014 Client component. Password form with autoFocus. Shows toast on error. Rate limit feedback.\n\n#### Dashboard Page\n\n`app/admin/observability/page.tsx` \u2014 `'use client'` component. Fetches from 4 admin API routes via `Promise.all`. Auto-refreshes every 30 seconds via `setInterval`. Time range selector (`24h | 7d | 30d`) persisted in URL query params via `useSearchParams`.\n\n#### Dashboard Panels\n\n| Panel | Component | Data Source | Charts |\n|-------|-----------|-------------|--------|\n| Health | `health-panel.tsx` | `/api/admin/observability/summary` + `/api/observability/health` | Status indicators (green/yellow/red), error rate sparkline |\n| Errors | `error-panel.tsx` | `/api/admin/observability/errors` | Sortable table, bar chart (by route), top 5 failures list |\n| Performance | `performance-panel.tsx` | `/api/admin/observability/performance` | Route latency table, RPC timing table, latency trend line chart. Note: \"API Route Latency\" (not page routes). Link to Vercel Analytics for Web Vitals. |\n| Usage | `usage-panel.tsx` | `/api/admin/observability/usage` | DAU line chart, chore completion bar charts, peak hours heatmap, AI volume chart |\n\nReusable components: `metric-card.tsx` (value + label + trend), `sparkline-chart.tsx` (thin Recharts LineChart wrapper), `error-table.tsx` (sortable, paginated).\n\nAll Recharts components use dynamic imports: `dynamic(() => import('recharts').then(m => m.LineChart), { ssr: false })`.\n\nPer-panel error handling: each panel shows \"Unable to load [section]\" with retry button independently. No full-page error.\n\nAdmin cleanup button: \"Run Cleanup (90 days)\" calls `cleanup_old_observability_data()` via Server Action. Shows result count.\n\nLogout button in layout header.\n\n### Error Handling Strategy\n\n| Component | Strategy |\n|---|---|\n| `logError()` / `trackEvent()` | Silent failure (console.warn in dev). Never throw. |\n| `withObservability` wrapper | `void` all logging calls. Response returned before INSERT. |\n| `instrumentedRpc` | `void` all logging calls. Returns same `{ data, error }` shape. |\n| Ingest API | Return 200 even on partial failure. Validate payload strictly. |\n| Middleware timing | If timing fails, request proceeds normally. |\n| Dashboard panels | Per-panel error state with retry, not full page error. |\n| Admin auth | Redirect to login on invalid/expired session. Rate limit on login. |\n| Health probe | Insert + immediate delete to verify write path. |\n\n---\n\n## Key Design Decisions\n\n### 1. No Foreign Keys on Log Tables\n\n**Decision**: `user_id` and `family_id` are plain `uuid` columns with no FK constraints.\n**Source**: Design B (refined)\n**Rationale**: FK constraints would cause INSERT failures during race conditions (user deletion mid-logging) and add write overhead. Fire-and-forget logging must never fail due to referential violations.\n**Alternative**: Design A kept FK with `ON DELETE SET NULL`. Rejected because it contradicts the core principle that logging must never block or fail.\n\n### 2. App-Level Event Type Validation (No CHECK Constraint)\n\n**Decision**: `app_events.event_type` is a plain `text` column validated by TypeScript union + runtime check.\n**Source**: Design B (refined)\n**Rationale**: CHECK constraints require migrations to extend. App-level validation via `constants.ts` is a single-file change for new event types.\n**Alternative**: Design A's CHECK constraint. Rejected due to migration friction with the project's non-standard migration setup.\n\n### 3. Dedicated `duration_ms` Column\n\n**Decision**: `app_events` has a `duration_ms integer` column instead of storing timing only in JSONB metadata.\n**Source**: Design B\n**Rationale**: Performance aggregation queries (`AVG`, `percentile_cont`) operate directly on the column without JSONB extraction overhead. Expression indexes still needed for `metadata->>'route'` grouping.\n**Alternative**: Design A's JSONB-only approach. Rejected because `percentile_cont` on JSONB-extracted numerics is slower and harder to index.\n\n### 4. REVOKE EXECUTE on All Observability RPCs\n\n**Decision**: All `SECURITY DEFINER` RPCs have `REVOKE EXECUTE FROM PUBLIC/authenticated/anon`.\n**Source**: Design B (refined)\n**Rationale**: `SECURITY DEFINER` bypasses RLS. Without REVOKE, any browser client could call `get_observability_summary()` and dump all error/activity data. This is a critical security fix.\n**Alternative**: Design A assumed RLS was sufficient. Incorrect \u2014 `SECURITY DEFINER` explicitly bypasses RLS.\n\n### 5. Web Crypto API for Session Signing\n\n**Decision**: All crypto uses `SubtleCrypto` (Web Crypto API), not Node.js `crypto`.\n**Source**: Design A (refined)\n**Rationale**: Next.js middleware runs on Edge Runtime where Node.js `crypto` is unavailable. Web Crypto API works in both Edge and Node.js runtimes.\n**Alternative**: Node.js `crypto`. Would crash in middleware.\n\n### 6. Session Versioning for Password Rotation\n\n**Decision**: Session token includes `v: HMAC(secret, password).slice(0, 8)`. Changing password invalidates all sessions.\n**Source**: Design B (refined)\n**Rationale**: Stateless revocation without a session store. Changing `ADMIN_OBSERVABILITY_PASSWORD` changes the version, invalidating all cookies immediately.\n**Alternative**: Design A's time-based-only expiry. Rejected because compromised password leaves a 24h window.\n\n### 7. Remove Web Vitals, Keep Page Views\n\n**Decision**: No `web_vital` event type. No `web-vitals` dependency. Keep `page_view` for DAU.\n**Source**: Merged \u2014 Design B's removal of web_vital + Design A's PageViewTracker for page_view.\n**Rationale**: Vercel Analytics already handles CWV better than a custom implementation. But `page_view` is needed for accurate DAU counting (users who browse but don't complete actions).\n**Alternative**: Design A included both. Rejected because web_vital duplicates Vercel Analytics and adds a dependency.\n\n### 8. Database-Backed Admin Auth Rate Limiting\n\n**Decision**: `admin_auth_attempts` table for brute-force protection, not in-memory Map.\n**Source**: Design B (refined)\n**Rationale**: In-memory state doesn't persist across serverless function invocations on Vercel. A small Supabase table lookup per auth attempt is negligible overhead and works correctly.\n**Alternative**: In-memory Map (both original designs). Rejected for serverless incompatibility.\n\n### 9. Single Ingest Endpoint (Not Separate Error/Event Endpoints)\n\n**Decision**: One `POST /api/observability/ingest` for all client-side logging.\n**Source**: Design A\n**Rationale**: Simpler client-side code \u2014 one URL, one fetch. Batch support allows combining errors and events in a single request. Payload type discriminator (`type: 'error' | 'event' | 'batch'`) is clean.\n**Alternative**: Design B's separate endpoints. Rejected because two endpoints means two URLs to maintain, two rate limiters, and more client-side complexity.\n\n### 10. Client-Side Dashboard with Auto-Refresh\n\n**Decision**: Dashboard is a `'use client'` component fetching from admin API routes, auto-refreshing every 30 seconds.\n**Source**: Design B (refined)\n**Rationale**: An observability dashboard needs live data. Server Components can't auto-refresh without full page reload. Client-side fetching with `setInterval` is the standard pattern for dashboards.\n**Alternative**: Design A's Server Component approach. Rejected because it requires manual browser refresh for updated data.\n\n---\n\n## How This Improves Current Architecture\n\n### Weakness: No Error Visibility\n\n**From codebase brief**: Errors are handled per-component with `toast.error()` or error states, but there's no aggregated view of what's failing across the app.\n\n**How this plan addresses it**: All errors flow into `app_errors` via `logError()` wrappers on API routes (`withObservability`), Supabase RPCs (`instrumentedRpc`), and client components (`ObservabilityErrorBoundary`). The Error panel provides sortable error list, frequency by route, and top failures.\n\n**Remaining risk**: Server-side errors in Server Components (not API routes) are not automatically captured. These would need explicit `logError()` calls.\n\n### Weakness: No Performance Monitoring\n\n**From codebase brief**: No visibility into API response times or RPC durations. The 5-second AI timeout is the only performance safety net.\n\n**How this plan addresses it**: `instrumentedRpc` wraps all 9 existing RPCs with timing. `withObservability` times all API routes. The `duration_ms` column enables efficient p95 calculations. The Performance panel shows route latency and RPC timing with trend lines.\n\n**Remaining risk**: SSR page render duration is not measured (only API routes). Page-level performance is available via Vercel Analytics.\n\n### Weakness: No Usage Analytics for Admin\n\n**From codebase brief**: The analytics dashboard is user-facing (kids and parents see their own stats). There's no admin view of overall app health or usage patterns.\n\n**How this plan addresses it**: `app_events` captures all key user actions. The Usage panel shows DAU, most/least completed chores, peak hours, and AI call volume. The Health panel shows active user count and error rates.\n\n**Remaining risk**: Historical data before implementation doesn't exist. Dashboard starts cold.\n\n### Weakness: No Admin Interface\n\n**From codebase brief**: \"No existing `/admin` route.\" Admin operations require direct database access.\n\n**How this plan addresses it**: Full admin route structure at `/admin/observability` with password protection, 4-panel dashboard, cleanup tooling, and logout.\n\n**Remaining risk**: Admin password management is manual (env var). No multi-user admin or audit trail.\n\n---\n\n## Implementation Strategy\n\n### Phase 1: Database & Core Instrumentation\n\n**Goal**: Tables, indexes, RPCs, and core logging functions.\n\n**Files to create**:\n- `supabase/migrations/014_add_observability_tables.sql` \u2014 All tables, indexes, RLS, RPCs, REVOKE statements, cleanup RPC\n- `lib/observability/constants.ts` \u2014 Event types, error types, rate limit constants, allowed metadata keys\n- `lib/observability/error-logger.ts` \u2014 `logError()` function (service-role client, fire-and-forget)\n- `lib/observability/event-tracker.ts` \u2014 `trackEvent()` function (service-role client, fire-and-forget)\n- `lib/observability/instrumented-client.ts` \u2014 `instrumentedRpc()` wrapper\n- `lib/observability/admin-auth.ts` \u2014 `verifyAdminPassword()`, `createAdminSession()`, `validateAdminSession()` (SubtleCrypto)\n- `lib/observability/ingest-validation.ts` \u2014 `validateIngestPayload()`, `sanitizeMetadata()`\n- `lib/observability/server-timing.ts` \u2014 `getRequestStartMs()` helper\n- `lib/observability/cleanup.ts` \u2014 `runCleanup()` wrapper\n- `lib/types.ts` \u2014 Add `AppError`, `AppEvent` types\n\n**Tests**:\n- `__tests__/lib/observability/error-logger.test.ts`\n- `__tests__/lib/observability/event-tracker.test.ts`\n- `__tests__/lib/observability/instrumented-client.test.ts`\n- `__tests__/lib/observability/admin-auth.test.ts`\n- `__tests__/lib/observability/ingest-validation.test.ts`\n- `__tests__/lib/observability/server-timing.test.ts`\n- `__tests__/lib/observability/cleanup.test.ts`\n- `__tests__/db/observability-rpcs.db.test.ts`\n\n**Run migration**: via Management API (`POST https://api.supabase.com/v1/projects/eebssnhneusiyuffoajj/database/query`)\n\n### Phase 2: API Routes & Middleware Instrumentation\n\n**Goal**: Client/server ingestion endpoints, middleware timing, wrap existing code.\n\n**Files to create**:\n- `app/api/observability/ingest/route.ts` \u2014 Client-side event/error ingestion\n- `app/api/observability/health/route.ts` \u2014 Health check with logging pipeline probe\n- `app/api/admin/auth/route.ts` \u2014 Admin login with DB-backed rate limiting\n- `app/api/admin/logout/route.ts` \u2014 Admin logout\n- `app/api/admin/observability/summary/route.ts`\n- `app/api/admin/observability/errors/route.ts`\n- `app/api/admin/observability/performance/route.ts`\n- `app/api/admin/observability/usage/route.ts`\n- `lib/observability/middleware-timing.ts` \u2014 `withObservability()` wrapper\n- `components/error-boundary.tsx` \u2014 React Error Boundary\n- `components/page-view-tracker.tsx` \u2014 Route change tracker for DAU\n\n**Files to modify**:\n- `middleware.ts` \u2014 Add `x-request-start-ms` header, admin auth cookie check\n- `lib/supabase/middleware.ts` \u2014 Add `/admin/observability` protection\n- `app/api/ai/analytics-insights/route.ts` \u2014 Wrap with `withObservability`, add `ai_insight_generated` event\n- `app/api/ai/encouragement/route.ts` \u2014 Wrap with `withObservability`, add `ai_encouragement_generated` event\n- `app/api/ai/parse-quest/route.ts` \u2014 Wrap with `withObservability`, add `ai_quest_parsed` event\n- `app/(dashboard)/layout.tsx` \u2014 Add `<ObservabilityErrorBoundary>` wrapper, `<PageViewTracker>`\n- All 9 existing RPC call sites \u2014 Replace `supabase.rpc()` with `instrumentedRpc()`:\n  - `app/(dashboard)/analytics/` \u2014 `get_family_analytics`, `get_kid_analytics`, `get_kid_heatmap`\n  - `app/(dashboard)/me/` \u2014 `get_user_streaks`, `claim_streak_milestone`\n  - Streak-related handlers \u2014 `buy_streak_freeze`, `use_streak_freeze`\n  - `app/(auth)/join/` \u2014 `accept_family_invite`\n- Event tracking at call sites: task completion, reward claim, family join, streak milestone\n\n**Tests**:\n- `__tests__/api/observability/ingest.test.ts`\n- `__tests__/api/observability/health.test.ts`\n- `__tests__/api/admin/auth.test.ts`\n- `__tests__/api/admin/observability/summary.test.ts`\n- `__tests__/api/admin/observability/errors.test.ts`\n- `__tests__/api/admin/observability/performance.test.ts`\n- `__tests__/api/admin/observability/usage.test.ts`\n- `__tests__/lib/observability/middleware-timing.test.ts`\n- `__tests__/components/error-boundary.test.tsx`\n- `__tests__/components/page-view-tracker.test.tsx`\n\n### Phase 3: Admin Dashboard UI\n\n**Goal**: Login page, 4-panel dashboard, all chart components.\n\n**Files to create**:\n- `app/admin/observability/layout.tsx` \u2014 Admin layout with `<Toaster />`, logout button\n- `app/admin/observability/page.tsx` \u2014 Dashboard client component (auto-refresh, time range selector)\n- `app/admin/observability/login/page.tsx` \u2014 Login form\n- `app/admin/observability/login/actions.ts` \u2014 Login + logout Server Actions\n- `components/admin/health-panel.tsx` \u2014 Health status indicators, error rate sparkline\n- `components/admin/error-panel.tsx` \u2014 Error table + bar chart + top failures\n- `components/admin/performance-panel.tsx` \u2014 Route/RPC timing tables, latency trend\n- `components/admin/usage-panel.tsx` \u2014 DAU chart, chore charts, peak hours, AI volume\n- `components/admin/metric-card.tsx` \u2014 Reusable metric display (value + label + trend)\n- `components/admin/sparkline-chart.tsx` \u2014 Thin Recharts LineChart wrapper\n- `components/admin/error-table.tsx` \u2014 Sortable, paginated error list\n- `lib/observability/client-logger.ts` \u2014 Client-side `logEvent()` / `logError()` (sends to ingest API with x-obs-token)\n\n**Tests**:\n- `__tests__/components/admin/health-panel.test.tsx`\n- `__tests__/components/admin/error-panel.test.tsx`\n- `__tests__/components/admin/performance-panel.test.tsx`\n- `__tests__/components/admin/usage-panel.test.tsx`\n- `__tests__/components/admin/metric-card.test.tsx`\n- `__tests__/components/admin/sparkline-chart.test.tsx`\n- `__tests__/components/admin/error-table.test.tsx`\n- `__tests__/app/admin/observability/page.test.tsx`\n- `__tests__/app/admin/observability/login.test.tsx`\n- `__tests__/lib/observability/client-logger.test.ts`\n\n### Phase 4: E2E Tests & Polish\n\n**Files to create/modify**:\n- `e2e/admin-observability.spec.ts` \u2014 E2E test: login with wrong password (rejected), login with correct password, dashboard loads all 4 panels, logout\n- `playwright.config.ts` \u2014 Add `admin-observability.spec.ts` to `testMatch`\n- `.env.example` \u2014 Add `ADMIN_OBSERVABILITY_PASSWORD`, `ADMIN_SESSION_SECRET`, `NEXT_PUBLIC_OBSERVABILITY_INGEST_TOKEN`\n\n### Ordering Constraints\n\n```\nPhase 1 (DB + Core) \u2192 Phase 2 (API + Instrumentation) \u2192 Phase 3 (Dashboard UI) \u2192 Phase 4 (E2E)\n```\n\nPhase 1 must complete first (everything depends on tables and core functions). Phase 2 and Phase 3 can be partially parallelized after Phase 1 (Phase 3 needs admin API routes from Phase 2, but UI components can be built in parallel). Phase 4 needs everything.\n\n### Migration Steps\n\n1. Confirm migration number is still `014_` (check highest existing migration)\n2. Run migration SQL via Management API\n3. Verify tables, indexes, and RPCs created: `SELECT * FROM pg_tables WHERE tablename LIKE 'app_%'`\n4. Verify REVOKE: `SELECT has_function_privilege('anon', 'get_observability_summary(integer)', 'execute')` \u2192 should return `false`\n5. Add env vars to `.env.local`: `ADMIN_OBSERVABILITY_PASSWORD`, `ADMIN_SESSION_SECRET`, `NEXT_PUBLIC_OBSERVABILITY_INGEST_TOKEN`\n6. Add env vars to GitHub repository secrets for CI\n\n### Rollback Strategy\n\n- **Database**: Drop tables and functions: `DROP TABLE IF EXISTS app_errors, app_events, admin_auth_attempts CASCADE; DROP FUNCTION IF EXISTS get_observability_summary, get_recent_errors, get_performance_metrics, get_usage_analytics, cleanup_old_observability_data;`\n- **Code**: Revert to previous commit. `instrumentedRpc` wrappers are non-breaking (same return shape), so partial rollback is safe.\n- **Env vars**: Remove from `.env.local` and GitHub secrets\n\n---\n\n## Risk Mitigation\n\n### Top Risks\n\n| Risk | Likelihood | Impact | Mitigation |\n|------|-----------|--------|------------|\n| Table growth without cleanup | Medium | Medium | `cleanup_old_observability_data` RPC + admin button. Monitor table size monthly. |\n| Ingest endpoint abuse | Low | Medium | 8KB payload cap, 20-item batch cap, ingest token, Vercel DDoS protection. |\n| Service-role key exposure | Low | Critical | Key only used server-side in API routes. Never imported in client components. Verify with `grep -r SUPABASE_SERVICE_ROLE_KEY app/ components/`. |\n| Logging overhead on hot paths | Low | High | All logging is `void` (fire-and-forget). Measure with `performance.now()` after implementation. Target: < 1ms added per request. |\n| Admin password brute-force | Low | Medium | DB-backed rate limiting (5/min/IP). Timing-safe comparison. |\n\n### What to Monitor After Deployment\n\n- `app_events` and `app_errors` table sizes (weekly)\n- Dashboard load time (should be < 2s)\n- Ingest endpoint error rate (check server logs)\n- Admin auth attempts table for suspicious patterns\n\n### Decision Points\n\n- **If table growth exceeds expectations**: Add pg_cron for automated cleanup (deferred from v1)\n- **If dashboard load time exceeds 2s**: Add server-side caching of RPC results (30s TTL)\n- **If ingest endpoint sees abuse**: Add proper authentication (Supabase auth token) to ingest endpoint\n- **If SSR page performance visibility is needed**: Add OpenTelemetry integration (significant scope expansion)\n\n---\n\n## Success Metrics\n\n### Leading Indicators (During Implementation)\n\n- [ ] All new code has 100% unit test coverage\n- [ ] DB integration tests pass for all 5 RPCs\n- [ ] `REVOKE` verified: anon role cannot execute observability RPCs\n- [ ] Middleware adds < 1ms overhead (measured)\n- [ ] Dashboard loads in < 2 seconds with empty tables\n- [ ] E2E test passes: login \u2192 dashboard \u2192 all panels render \u2192 logout\n\n### Lagging Indicators (After Deployment)\n\n- Admin can identify the most common error within 30 seconds of opening dashboard\n- Error rate trends correlate with known deployment events\n- DAU numbers are consistent with Vercel Analytics traffic data (within 20%)\n- At least one bug is discovered via the error tracking that would have gone unnoticed otherwise\n- Table sizes remain under 100MB after 90 days of operation\n\n---\n\n## New Environment Variables\n\n```\nADMIN_OBSERVABILITY_[REDACTED] Required. The password to access /admin/observability\nADMIN_SESSION_[REDACTED] Required. Random 64-char string for signing session tokens\nNEXT_PUBLIC_OBSERVABILITY_INGEST_TOKEN=  # Required. Random 32-char string for ingest endpoint (public, not a secret)\n```\n\nAll three must be added to `.env.local`, `.env.example`, and GitHub repository secrets.\n",

<script>
// Use the same origin as the page (single server)
const API_BASE = window.location.origin;
const artifactCache = {};
let pendingDeleteId = null;
const expandedSessions = new Set(); // Track which sessions are expanded
let isFirstRender = true;
let lastDataJSON = ''; // Skip re-render when data unchanged

function dur(start, end) {
  if (!start || !end) return '--';
  const ms = new Date(end) - new Date(start);
  if (ms < 0) return '--';
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return `${m}m ${rs}s`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function timeAgo(iso) {
  if (!iso) return '';
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

function nodeIcon(status) {
  switch(status) {
    case 'complete': case 'completed': return '&#10003;';
    case 'in_progress': case 'running': return '&#8635;';
    case 'failed': return '&#10007;';
    default: return '';
  }
}

function statusText(status) {
  return (status || 'pending').replace(/_/g, ' ');
}

// DAG layout: group steps into tiers based on the dependency graph
const PIPELINE_TIERS = [
  ['code'],
  ['lint', 'test', 'db_test'],
  ['e2e', 'code_review'],
  ['smoke', 'visual'],
  ['report'],
  ['create_pr'],
];

function renderDAG(steps) {
  if (!steps) return '';
  const stepNames = Object.keys(steps);

  const activeTiers = PIPELINE_TIERS.filter(tier =>
    tier.some(s => stepNames.includes(s))
  );

  return activeTiers.map((tier, i) => {
    const nodes = tier.filter(s => stepNames.includes(s)).map(name => {
      const step = steps[name];
      const status = step.status || 'pending';
      const duration = dur(step.started_at, step.completed_at);
      const retries = step.retries || 0;

      const prettyName = name.replace(/_/g, ' ');

      let tooltipHtml = `
        <div class="tooltip">
          <div class="tooltip-row"><span class="tooltip-label">Status</span><span class="tooltip-value">${statusText(status)}</span></div>
          <div class="tooltip-row"><span class="tooltip-label">Duration</span><span class="tooltip-value">${duration}</span></div>
          ${retries > 0 ? `<div class="tooltip-row"><span class="tooltip-label">Retries</span><span class="tooltip-value">${retries}</span></div>` : ''}
          ${step.started_at ? `<div class="tooltip-row"><span class="tooltip-label">Started</span><span class="tooltip-value">${new Date(step.started_at).toLocaleTimeString()}</span></div>` : ''}
        </div>
      `;

      return `
        <div class="dag-node ${status}">
          ${status !== 'pending' ? `<div class="dag-node-icon">${nodeIcon(status)}</div>` : ''}
          ${retries > 0 ? `<div class="dag-node-retry">${retries}</div>` : ''}
          <div class="dag-node-name">${prettyName}</div>
          <div class="dag-node-time">${status === 'pending' ? 'waiting' : duration}</div>
          ${tooltipHtml}
        </div>
      `;
    }).join('');

    const connector = i < activeTiers.length - 1
      ? `<div class="dag-connector">&#8595;</div>`
      : '';

    return `
      <div class="dag-tier">
        <div class="dag-nodes">${nodes}</div>
      </div>
      ${connector}
    `;
  }).join('');
}

function renderTimelineBar(steps) {
  if (!steps) return '';
  const entries = Object.entries(steps).filter(([,s]) => s.started_at && s.completed_at);
  if (entries.length === 0) return '';

  const allStart = Math.min(...entries.map(([,s]) => new Date(s.started_at)));
  const allEnd = Math.max(...entries.map(([,s]) => new Date(s.completed_at)));
  const totalMs = allEnd - allStart;
  if (totalMs <= 0) return '';

  const segments = entries.map(([name, s]) => {
    const width = (new Date(s.completed_at) - new Date(s.started_at));
    const pct = Math.max((width / totalMs) * 100, 3);
    const d = dur(s.started_at, s.completed_at);
    const label = pct > 8 ? name.replace(/_/g, ' ') : '';
    return `<div class="timeline-segment" data-step="${name}" style="width:${pct}%" title="${name}: ${d}">${label}</div>`;
  }).join('');

  const legend = entries.map(([name, s]) => {
    const d = dur(s.started_at, s.completed_at);
    return `<div class="legend-item"><div class="legend-dot" style="background:var(--${name === 'code' ? 'accent' : name === 'test' ? 'green' : name === 'e2e' ? 'pink' : name === 'smoke' ? 'amber' : 'purple'})"></div>${name.replace(/_/g,' ')} ${d}</div>`;
  }).join('');

  return `
    <div class="timeline-bar">
      <div class="timeline-label">Execution Timeline &middot; Total: ${dur(new Date(allStart).toISOString(), new Date(allEnd).toISOString())}</div>
      <div class="timeline-track">${segments}</div>
      <div class="timeline-legend">${legend}</div>
    </div>
  `;
}

function renderPhases(phases) {
  if (!phases) return '';
  const entries = Object.entries(phases);
  return entries.map(([name, data], i) => {
    const status = data.status || 'pending';
    const d = dur(data.started_at, data.completed_at);
    const arrow = i < entries.length - 1 ? '<span class="phase-arrow">&#8594;</span>' : '';
    return `
      <div class="phase ${status}">
        <div class="phase-name">${name}</div>
        <div class="phase-time">${status === 'pending' ? '...' : d}</div>
      </div>
      ${arrow}
    `;
  }).join('');
}

async function fetchArtifacts(sessionDir) {
  if (!sessionDir) return null;
  if (artifactCache[sessionDir]) return artifactCache[sessionDir];
  if (window.STATIC_MODE) {
    const data = window.STATIC_ARTIFACTS[sessionDir] || null;
    if (data) artifactCache[sessionDir] = data;
    return data;
  }
  try {
    const res = await fetch(`${API_BASE}/artifacts?session_dir=${encodeURIComponent(sessionDir)}`);
    if (res.ok) {
      const data = await res.json();
      artifactCache[sessionDir] = data;
      return data;
    }
  } catch {}
  return null;
}

function renderInfoPanels(artifacts, executor, planner) {
  if (!artifacts && !planner) return '';
  let cards = '';

  // Plan card
  if (artifacts?.plan_summary || planner) {
    const summary = artifacts?.plan_summary || '';
    const firstLine = summary.split('\n').find(l => l.startsWith('#')) || '';
    const title = firstLine.replace(/^#+\s*/, '') || 'Plan';
    const bodyLines = summary.split('\n').slice(1).join('\n').trim();
    const planFile = artifacts?.plan_file || '';
    cards += `
      <div class="info-card" style="grid-column: span 2">
        <div class="info-card-header">
          <span class="info-card-title">&#128220; Plan</span>
          ${planFile ? `<span style="font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace">${planFile.split('/').pop()}</span>` : ''}
        </div>
        <div style="font-size:15px;font-weight:600;margin-bottom:6px">${title}</div>
        ${bodyLines ? `<div class="plan-summary">${bodyLines}</div>` : ''}
      </div>
    `;
  }

  // Code output card
  if (artifacts?.code_checklist || artifacts?.code_actions) {
    const cl = artifacts.code_checklist || {};
    const ca = artifacts.code_actions || {};
    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128187; Code Output</span>
          <span class="info-card-badge green">${ca.outcome || 'pass'}</span>
        </div>
        <div class="info-row"><span class="info-label">Checklist items</span><span class="info-value green">${cl.done || 0}/${cl.total || 0}</span></div>
        <div class="info-row"><span class="info-label">Files created</span><span class="info-value">${cl.files_created || 0}</span></div>
        <div class="info-row"><span class="info-label">Files modified</span><span class="info-value">${cl.files_modified || 0}</span></div>
        <div class="info-row"><span class="info-label">Files read</span><span class="info-value">${ca.files_read || 0}</span></div>
        <div class="info-row"><span class="info-label">Commands run</span><span class="info-value">${ca.commands_run || 0}</span></div>
      </div>
    `;
  }

  // Tests & Verification card — show all test/lint/smoke/visual/e2e steps
  const testStepNames = ['lint', 'test', 'db_test', 'e2e', 'smoke', 'visual'];
  const stepActions = artifacts?.step_actions || {};
  const stepChecklists = artifacts?.step_checklists || {};
  const executorSteps = executor?.steps || {};
  const visibleTestSteps = testStepNames.filter(s => stepActions[s] || stepChecklists[s] || executorSteps[s]);

  if (visibleTestSteps.length > 0) {
    const allPassed = visibleTestSteps.every(s => {
      const st = executorSteps[s]?.status;
      return st === 'complete' || st === 'completed';
    });
    const anyFailed = visibleTestSteps.some(s => executorSteps[s]?.status === 'failed');
    const overallBadge = anyFailed ? 'red' : allPassed ? 'green' : 'amber';
    const overallLabel = anyFailed ? 'FAIL' : allPassed ? 'PASS' : 'RUNNING';

    let rows = '';
    for (const name of visibleTestSteps) {
      const step = executorSteps[name] || {};
      const actions = stepActions[name] || {};
      const checklist = stepChecklists[name] || {};
      const status = step.status || 'pending';
      const prettyName = name.replace(/_/g, ' ');
      const statusColor = (status === 'complete' || status === 'completed') ? 'green' : status === 'failed' ? 'red' : 'amber';
      const statusLabel = status === 'complete' || status === 'completed' ? 'passed' : status;
      const outcome = actions.outcome || '';
      const retries = step.retries || 0;

      // Try to extract a summary from checklist evidence
      const items = checklist.checklist || [];
      const evidence = items.find(i => i.evidence)?.evidence || '';
      const passMatch = evidence.match(/(\d+)\s+passed/);
      const detail = passMatch ? passMatch[0] : outcome || '';

      rows += '<div class="info-row">';
      rows += '<span class="info-label">' + prettyName + (retries > 0 ? ' <span style="color:var(--amber);font-size:11px">(' + retries + ' retry)</span>' : '') + '</span>';
      rows += '<span class="info-value ' + statusColor + '">' + statusLabel + (detail ? ' &middot; ' + detail : '') + '</span>';
      rows += '</div>';
    }

    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#129514; Tests &amp; Checks</span>
          <span class="info-card-badge ${overallBadge}">${overallLabel}</span>
        </div>
        ${rows}
      </div>
    `;
  }

  // Code review card
  if (artifacts?.code_review) {
    const cr = artifacts.code_review;
    const retries = artifacts.code_review_retries || [];
    const verdict = cr.verdict || 'UNKNOWN';
    const isClean = verdict === 'CLEAN';
    const totalIssuesFound = retries.reduce((n, r) => n + (r.issue_count || r.issues?.length || 0), 0);
    const allIssues = retries.flatMap(r => (r.issues || []).map(i => ({...i, attempt: r.attempt})));

    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128269; Code Review</span>
          <span class="info-card-badge ${isClean ? 'green' : 'red'}">${verdict}</span>
        </div>
        <div class="info-row"><span class="info-label">Final verdict</span><span class="info-value ${isClean ? 'green' : 'red'}">${verdict}</span></div>
        <div class="info-row"><span class="info-label">Issues found</span><span class="info-value ${totalIssuesFound > 0 ? 'amber' : 'green'}">${totalIssuesFound}</span></div>
        <div class="info-row"><span class="info-label">Issues fixed</span><span class="info-value green">${isClean ? totalIssuesFound : 0}</span></div>
        <div class="info-row"><span class="info-label">Review attempts</span><span class="info-value">${retries.length + 1}</span></div>
        ${allIssues.map(issue => `
          <div class="review-issue">
            <div class="review-issue-file">
              <span class="review-issue-severity severity-${issue.severity || 'error'}">${issue.severity || 'error'}</span>
              ${issue.file || ''}${issue.line ? ':' + issue.line : ''}
            </div>
            <div class="review-issue-msg">${issue.message || ''}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  // PR card
  if (artifacts?.pr_url) {
    const prNum = artifacts.pr_url.match(/#?(\d+)$/)?.[1] || '';
    cards += `
      <div class="info-card">
        <div class="info-card-header">
          <span class="info-card-title">&#128640; Pull Request</span>
          <span class="info-card-badge accent">#${prNum}</span>
        </div>
        <div style="margin-top:4px">
          <a href="${artifacts.pr_url}" target="_blank" class="info-link">${artifacts.pr_url} &#8599;</a>
        </div>
      </div>
    `;
  }

  if (!cards) return '';
  return `
    <div class="section-divider">
      <div class="section-label">Details</div>
      <div class="info-grid">${cards}</div>
    </div>
  `;
}

function renderErrors(steps) {
  if (!steps) return '';
  const errors = Object.entries(steps)
    .filter(([, s]) => s.last_error && s.retries > 0)
    .map(([name, s]) => `
      <div class="error-panel">
        <div class="error-panel-title">&#9888; ${name.replace(/_/g, ' ')} (${s.retries} ${s.retries === 1 ? 'retry' : 'retries'})</div>
        <div class="error-panel-text">${s.last_error}</div>
      </div>
    `);
  return errors.join('');
}

function confirmDelete(sessionId) {
  pendingDeleteId = sessionId;
  document.getElementById('delete-modal').classList.add('show');
}

function cancelDelete() {
  pendingDeleteId = null;
  document.getElementById('delete-modal').classList.remove('show');
}

async function executeDelete() {
  if (!pendingDeleteId) return;
  try {
    await fetch(`${API_BASE}/session/${pendingDeleteId}`, { method: 'DELETE' });
    // Clear artifact cache for this session
    Object.keys(artifactCache).forEach(k => {
      if (k.includes(pendingDeleteId)) delete artifactCache[k];
    });
    fetchData();
  } catch (e) {
    console.error('Delete failed:', e);
  }
  cancelDelete();
}

function toggleExpand(el) {
  el.classList.toggle('expanded');
  const id = el.getAttribute('data-id');
  if (id) {
    if (el.classList.contains('expanded')) {
      expandedSessions.add(id);
    } else {
      expandedSessions.delete(id);
    }
  }
}

function render(data) {
  const projects = data.projects || [];

  // Stats
  const planners = projects.filter(p => p.planner).length;
  const completedSteps = projects.reduce((n, p) => {
    return n + (p.executors || []).reduce((m, e) => {
      return m + Object.values(e.steps || {}).filter(s => s.status === 'complete').length;
    }, 0);
  }, 0);
  const totalRetries = projects.reduce((n, p) => {
    return n + (p.executors || []).reduce((m, e) => {
      return m + Object.values(e.steps || {}).reduce((r, s) => r + (s.retries || 0), 0);
    }, 0);
  }, 0);

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-card"><div class="stat-value accent">${data.total_sessions || 0}</div><div class="stat-label">Sessions</div></div>
    <div class="stat-card"><div class="stat-value green">${completedSteps}</div><div class="stat-label">Steps Done</div></div>
    <div class="stat-card"><div class="stat-value pink">${planners}</div><div class="stat-label">Plans</div></div>
    <div class="stat-card"><div class="stat-value amber">${totalRetries}</div><div class="stat-label">Retries</div></div>
  `;

  if (projects.length === 0) {
    document.getElementById('main').innerHTML = `
      <div class="empty">
        <div class="empty-icon">&#9881;</div>
        <div class="empty-text">No forge sessions yet. Run <code>forge drive</code> to get started.</div>
      </div>
    `;
    return;
  }

  const cards = projects.map((project, idx) => {
    const status = project.overall_status || 'inactive';
    const planner = project.planner;
    const executor = (project.executors || [])[0];
    const created = project.created_at;
    const problem = project.problem_statement || 'Untitled Session';
    const shortProblem = problem.length > 120 ? problem.substring(0, 120) + '...' : problem;
    const sessionId = project.session_id || (planner ? planner.session_id : executor?.session_id || '');
    const totalDur = executor
      ? dur(executor.created_at, executor.updated_at)
      : planner
        ? dur(planner.created_at, planner.updated_at)
        : '--';

    let body = '';

    if (planner && planner.phases) {
      body += `
        <div class="section-label">Planning Phases</div>
        <div class="phases">${renderPhases(planner.phases)}</div>
      `;
    }

    if (executor && executor.steps) {
      body += `
        <div class="section-label">Pipeline DAG</div>
        <div class="dag">${renderDAG(executor.steps)}</div>
        ${renderTimelineBar(executor.steps)}
        ${renderErrors(executor.steps)}
      `;
    }

    const artifactId = `artifacts-${sessionId.replace(/[^a-zA-Z0-9]/g, '_')}`;

    return `
      <div class="project ${expandedSessions.has(sessionId) || (isFirstRender && idx === 0) ? 'expanded' : ''}" data-id="${sessionId}" data-executor-dir="${executor?.session_dir || ''}" data-planner-dir="${planner?.session_dir || ''}">
        <div class="project-header" onclick="toggleExpand(this.parentElement)">
          <div>
            <div class="project-title">${shortProblem}</div>
            <div class="project-meta">
              <span>&#128337; ${timeAgo(created)}</span>
              <span>&#9201; ${totalDur}</span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted)">${sessionId}</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <div class="badge badge-${status}">${statusText(status)}</div>
            <button class="delete-btn" onclick="event.stopPropagation(); confirmDelete('${sessionId}')" title="Delete session">&#128465;</button>
            <svg class="expand-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
          </div>
        </div>
        <div class="collapsible-body">
          <div class="project-body">
            ${body}
            <div id="${artifactId}"></div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.getElementById('main').innerHTML = cards;

  // On first render, seed expandedSessions from the DOM
  if (isFirstRender) {
    document.querySelectorAll('.project.expanded').forEach(el => {
      const id = el.getAttribute('data-id');
      if (id) expandedSessions.add(id);
    });
    isFirstRender = false;
  }

  // Async: fetch and render artifacts for each project
  projects.forEach(async (project) => {
    const executor = (project.executors || [])[0];
    const planner = project.planner;
    const sessionId = project.session_id || (planner ? planner.session_id : executor?.session_id || '');
    const artifactId = `artifacts-${sessionId.replace(/[^a-zA-Z0-9]/g, '_')}`;
    const container = document.getElementById(artifactId);
    if (!container) return;

    const sessionDir = executor?.session_dir;
    if (sessionDir) {
      const artifacts = await fetchArtifacts(sessionDir);
      if (artifacts) {
        container.innerHTML = renderInfoPanels(artifacts, executor, planner);
      }
    }
  });
}

async function fetchData() {
  if (window.STATIC_MODE) {
    const data = window.STATIC_SESSIONS;
    const dataJSON = JSON.stringify(data);
    if (dataJSON === lastDataJSON && !isFirstRender) return;
    lastDataJSON = dataJSON;
    Object.keys(artifactCache).forEach(k => delete artifactCache[k]);
    render(data);
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/sessions`);
    if (res.ok) {
      const data = await res.json();
      const dataJSON = JSON.stringify(data);
      if (dataJSON === lastDataJSON && !isFirstRender) return;
      lastDataJSON = dataJSON;
      Object.keys(artifactCache).forEach(k => delete artifactCache[k]);
      render(data);
      return;
    }
  } catch {}
  document.getElementById('main').innerHTML = `
    <div class="empty">
      <div class="empty-icon">&#9888;</div>
      <div class="empty-text">Cannot connect to Forge dashboard server.<br>Run: <code>forge dashboard</code></div>
    </div>
  `;
}

fetchData();
// auto-refresh disabled in static mode
</script>
</body>
</html>
