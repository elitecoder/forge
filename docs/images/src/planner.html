<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="fig.css">
<script src="dark.js"></script><script src="fig.js"></script></head>
<body><div id="fig">
<div class="k">forge plan drive</div>
<div class="h">Two designs argue, and one <em>plan</em> comes out.</div>
<p class="cap">Every phase writes its result to a file in the planner's session directory.</p>
<svg id="s" viewBox="0 0 1104 500" width="1104" height="500" style="margin-top:28px"></svg>
</div>
<script>
// Source: src/forge/planner/driver.py (PHASE_ORDER, PHASE_MODELS, PHASE_AGENTS,
// _verdict_blocks, _promote_refined_to_final) and planner/commands.py cmd_approve.
const M = 220, A = 120, B = 320, R = 8;
const col = { gk: 175, ar: 330, cr: 480, rf: 630, jd: 770, en: 875, ap: 985, doc: 1074 };
const p = [];
// headers: phase name and default model
[["gatekeeper", "gk", "opus"], ["architects", "ar", "opus"], ["critics", "cr", "opus"],
 ["refiners", "rf", "sonnet"], ["judge", "jd", "opus"], ["enrichment", "en", "sonnet"],
 ["approval", "ap", "sonnet"]].forEach(([n, c, m]) => {
  p.push(`<text x="${col[c]}" y="18" text-anchor="middle" style="font-size:16px">${n}</text>`,
    D.t(col[c], 42, m, "t"));
});
// problem in
p.push(D.dot(12, M, 6, "inkf"), D.t(0, M - 18, "your problem", "si", "start"),
  D.line([[20, M], [col.gk - R - 4, M]]));
// split into two tracks
const split = (y) => D.curve([col.gk + R, M], [col.gk + 80, M], [col.ar - 80, y], [col.ar - R - 4, y]);
p.push(split(A), split(B), D.t(col.ar, A + 34, "top-down", "si"), D.t(col.ar, B - 24, "bottom-up", "si"));
// tracks
[[A, "a"], [B, "b"]].forEach(([y, id]) => {
  p.push(D.line([[col.ar + R, y], [col.cr - R - 4, y]]), D.line([[col.cr + R, y], [col.rf - R - 4, y]]));
  [["ar", `design-${id}.md`], ["cr", `critique-${id}.md`], ["rf", `refined-${id}.md`]].forEach(([c, f]) =>
    p.push(D.dot(col[c], y, R), D.t(col[c], y === A ? y - 18 : y + 32, f, "t")));
});
// merge into judge
const merge = (y) => D.curve([col.rf + R, y], [col.rf + 80, y], [col.jd - 80, M], [col.jd - R - 4, M]);
p.push(merge(A), merge(B));
// main line after judge
p.push(D.dot(col.gk, M, R), D.dot(col.jd, M, R),
  D.line([[col.jd + R, M], [col.en - R - 4, M]]), D.dot(col.en, M, R),
  D.line([[col.en + R, M], [col.ap - R - 4, M]]), D.dot(col.ap, M, R),
  D.line([[col.ap + R, M], [col.doc - 24, M]]),
  D.t(col.en, M + 32, "preset skills", "t"));
// final plan document
const dx = col.doc - 18, dy = M - 26;
p.push(`<path class="f m" d="M${dx} ${dy} H${dx + 26} L${dx + 36} ${dy + 10} V${dy + 52} H${dx} Z"/>`,
  `<path class="m" d="M${dx + 8} ${dy + 20} H${dx + 28} M${dx + 8} ${dy + 30} H${dx + 24} M${dx + 8} ${dy + 40} H${dx + 28}"/>`,
  D.t(1104, M + 52, "final-plan.md", "mt", "end"));
// lite mode: refined-a.md becomes the plan, judge skipped
p.push(D.curve([col.rf + R + 4, A], [col.en - 40, A], [col.en, A + 40], [col.en, M - R - 4], "d"),
  D.t(col.rf + 60, A - 50, "lite mode: refined-a.md is the plan, no judge", "si", "start"));
// spec gate: pause for answers
p.push(D.line([[col.gk, M + R + 4], [col.gk, 410]], "d"),
  D.t(col.gk - 12, 372, "gaps found", "t", "end"),
  D.box(40, 412, 290, 64, "w"),
  D.t(185, 438, "planner pauses", "", "middle"),
  D.t(185, 462, "you answer spec-gaps.md", "t", "middle"),
  D.line([[262, 412], [262, 292]], "d"),
  D.t(276, 386, "forge plan approve, then --resume", "t", "start"));
D.draw(p);
</script></body></html>
