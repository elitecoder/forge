<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="fig.css">
<script src="dark.js"></script><script src="fig.js"></script></head>
<body><div id="fig">
<div class="k">when a step fails</div>
<div class="h">A failed check goes to a <em>fix agent</em>, then runs again.</div>
<p class="cap">Forge reruns the command itself after each fix, so only a real exit code 0 passes the step.</p>
<svg id="s" viewBox="0 0 1104 420" width="1104" height="420" style="margin-top:28px"></svg>
</div>
<script>
// Source: executor/driver.py (_handle_command_step, MAX_STEP_RETRIES = 3, main --resume),
// executor/engine/agents/fix_agent.py (run: agent, then _re_execute_command),
// executor/engine/pipeline_ops.py (get_next_steps blocks dependents of a failed step).
const p = [];
// left: the fix loop
p.push(D.box(0, 40, 180, 64), D.t(90, 66, "run the command"), D.t(90, 90, "lint, test", "t"));
p.push(D.line([[180, 72], [246, 72]]));
p.push(`<path class="f" d="M300 34 L350 72 L300 110 L250 72 Z"/>`, D.t(300, 78, "exit 0?", ""));
p.push(D.line([[350, 72], [394, 72]]), D.dot(408, 72, 9, "inkf"),
  D.t(428, 66, "step passes", "", "start"), D.t(428, 90, "checkpoint written", "t", "start"));
p.push(D.line([[300, 110], [300, 182]]), D.t(312, 148, "non-zero exit", "t", "start"));
p.push(D.box(210, 186, 180, 64, "w"), D.t(300, 212, "error file"), D.t(300, 236, "lint-errors.txt", "t"));
p.push(D.line([[210, 218], [184, 218]], "m"));
p.push(D.box(0, 186, 180, 64, "f m"), D.t(90, 212, "fix agent", "mt"), D.t(90, 236, "error + fix hints", "t"));
p.push(D.line([[90, 186], [90, 108]]), D.t(102, 152, "rerun", "t", "start"));
p.push(D.t(90, 284, "up to 3 attempts", "t mt"));
p.push(D.line([[90, 300], [90, 340]], "d"),
  D.t(0, 372, "still failing: the step fails, and", "si", "start"),
  D.t(0, 398, "every step after it is blocked", "si", "start"));
// divider
p.push(`<path class="faint" d="M616 20 V400"/>`);
// right: resume after an interruption
const xs = [660, 780, 900, 1030], names = ["code", "lint", "test", "code_review"];
const mark = (x, y, s) => s === "done"
  ? `<rect class="inkf" x="${x - 9}" y="${y - 9}" width="18" height="18" rx="2"/>`
  : s === "run" ? D.dot(x, y, 9) + D.dot(x, y, 3.5, "inkf") : D.dot(x, y, 9);
p.push(D.t(640, 34, "after a crash or Ctrl+C", "si", "start"));
names.forEach((n, i) => p.push(D.t(xs[i], 82, n, "t")));
["done", "done", "run", "wait"].forEach((s, i) => p.push(mark(xs[i], 112, s)));
p.push(`<path class="thin" d="M${xs[0] + 9} 112 H${xs[1] - 9} M${xs[1] + 9} 112 H${xs[2] - 9} M${xs[2] + 9} 112 H${xs[3] - 9}"/>`);
p.push(D.line([[840, 140], [840, 222]]), D.t(856, 186, "forge drive --resume", "", "start"));
["done", "done", "wait", "wait"].forEach((s, i) => p.push(mark(xs[i], 250, s)));
p.push(`<path class="thin" d="M${xs[0] + 9} 250 H${xs[1] - 9} M${xs[1] + 9} 250 H${xs[2] - 9} M${xs[2] + 9} 250 H${xs[3] - 9}"/>`);
p.push(D.t(640, 312, "Steps with a checkpoint stay done.", "si", "start"),
  D.t(640, 340, "Steps left running go back to pending.", "si", "start"));
// legend
p.push(`<rect class="inkf" x="${640}" y="380" width="14" height="14" rx="2"/>`, D.t(662, 392, "passed", "t", "start"),
  D.dot(760, 387, 7), D.dot(760, 387, 3, "inkf"), D.t(776, 392, "running", "t", "start"),
  D.dot(880, 387, 7), D.t(896, 392, "pending", "t", "start"));
D.draw(p);
</script></body></html>
