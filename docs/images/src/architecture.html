<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="fig.css">
<script src="dark.js"></script><script src="fig.js"></script></head>
<body><div id="fig">
<div class="k">architecture</div>
<div class="h">How the pieces fit, from <em>plan</em> to pull request.</div>
<p class="cap">Both halves run every agent through one provider, and everything they do lands on disk.</p>
<svg id="s" viewBox="0 0 1104 492" width="1104" height="492" style="margin-top:28px"></svg>
</div>
<script>
// Source: src/forge/cli.py (six subcommands), planner/driver.py, executor/driver.py,
// providers/claude.py (claude -p, --plugin-dir), executor/engine/pipeline_ops.py
// resolve_preset_dir (lookup order), core/session.py (FORGE_SESSIONS), dashboard/server.py.
const p = [];
// CLI row
p.push(D.t(0, 40, "forge", "big", "start"));
const pills = [["plan", 90], ["drive", 430], ["execute", 530], ["setup", 650], ["status", 880], ["dashboard", 984]];
const px = {};
pills.forEach(([n, x]) => {
  const w = n.length * 10.2 + 28; px[n] = x + w / 2;
  p.push(`<rect class="f" x="${x}" y="12" width="${w}" height="38" rx="19"/>`, D.t(x + w / 2, 37, n));
});
// row 2: planner, executor, sessions
const R2 = 120, H2 = 150;
p.push(D.box(0, R2, 250, H2), D.t(20, R2 + 34, "planner", "", "start"),
  D.t(20, R2 + 66, "8 phases", "t", "start"), D.t(20, R2 + 88, "two design tracks", "t", "start"),
  D.t(20, R2 + 110, "one judge", "t", "start"));
p.push(D.box(390, R2, 360, H2), D.t(410, R2 + 34, "executor", "", "start"),
  D.t(410, R2 + 66, "runs each step once its", "t", "start"), D.t(410, R2 + 88, "inputs pass; checks proof,", "t", "start"),
  D.t(410, R2 + 110, "writes checkpoints", "t", "start"));
p.push(D.box(880, R2, 224, H2, "w"), D.t(898, R2 + 34, "~/.forge/sessions/", "", "start"),
  D.t(898, R2 + 66, "planner/", "t", "start"), D.t(898, R2 + 88, "executor/", "t", "start"),
  D.t(898, R2 + 110, "registry.jsonl", "t", "start"));
// CLI to components
p.push(D.line([[px.plan, 50], [px.plan, R2 - 4]]), D.line([[px.drive, 50], [px.drive, R2 - 4]]),
  D.line([[px.execute, 50], [px.execute, R2 - 4]]),
  D.line([[px.status, 50], [px.status, R2 - 4]], "d"), D.line([[px.dashboard, 50], [px.dashboard, R2 - 4]], "d"),
  D.t(px.status + 12, 92, "read", "t", "start"));
// handoff
p.push(D.line([[250, R2 + 75], [386, R2 + 75]], "m"), D.t(318, R2 + 63, "final-plan.md", "t mt"));
p.push(D.line([[750, R2 + 75], [876, R2 + 75]]), D.t(813, R2 + 63, "state, logs", "t"));
// row 3: provider and presets
const R3 = 340;
p.push(D.box(0, R3, 700, 110), D.t(20, R3 + 34, "provider", "", "start"),
  D.t(20, R3 + 64, "claude -p --plugin-dir skins/claude-code", "t", "start"),
  D.t(20, R3 + 88, "plugin: agent definitions, lint and build hooks", "t", "start"));
p.push(D.line([[125, R2 + H2], [125, R3 - 4]]), D.line([[500, R2 + H2], [500, R3 - 4]]),
  D.t(137, 312, "agents", "t", "start"), D.t(512, 312, "agents", "t", "start"));
p.push(D.box(880, R3 - 40, 224, 190), D.t(898, R3 - 6, "presets", "", "start"),
  D.t(898, R3 + 20, "first match wins", "t", "start"),
  D.t(898, R3 + 54, "1  a path", "t", "start"), D.t(898, R3 + 78, "2  ~/.forge/presets/", "t", "start"),
  D.t(898, R3 + 102, "3  FORGE_PRESETS_PATH", "t", "start"), D.t(898, R3 + 126, "4  npm-ts, python-uv", "t", "start"));
p.push(D.curve([876, R3 + 40], [800, R3 + 40], [700, 300], [700, R2 + H2 + 4]));
D.draw(p);
</script></body></html>
