<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="fig.css">
<script src="dark.js"></script><script src="fig.js"></script></head>
<body><div id="fig">
<div class="k">forge drive · bundled presets</div>
<div class="h">No pull request without a <em>checkpoint</em> for every step.</div>
<p class="cap">The full pipeline in npm-ts and python-uv. A step's checkpoint is written only when its proof holds.</p>
<svg id="s" viewBox="0 0 1104 484" width="1104" height="484" style="margin-top:28px"></svg>
</div>
<script>
// Source: src/forge/presets/*/manifest.json (pipelines, steps, models, evidence),
// executor/driver.py (dispatch_loop, run_pre_pr_gate), executor/pre_pr_gate.py,
// executor/engine/agents/code_agent.py (_has_code_changes).
const p = [], H = 64, MY = 150;
const step = (x, y, w, name, kind) => p.push(D.box(x, y - H / 2, w, H),
  D.t(x + w / 2, y - 4, name), D.t(x + w / 2, y + 20, kind, "t"));
const proof = (cx, a) => p.push(D.t(cx, 290, a, "t"));
const S = { code: [0, 130], lint: [190, 120], test: [190, 120], rev: [370, 170], rep: [600, 110], pr: [830, 140] };
const L = { lint: MY - 62, test: MY + 62 };
step(0, MY, 130, "code", "ai · sonnet");
step(190, L.lint, 120, "lint", "command");
step(190, L.test, 120, "test", "command");
step(370, MY, 170, "code_review", "ai · opus");
step(620, MY, 110, "report", "inline");
step(830, MY, 140, "create_pr", "ai · sonnet");
// edges
const fan = (y) => D.curve([130, MY], [165, MY], [160, y], [186, y]);
const join = (y) => D.curve([310, y], [340, y], [335, MY], [366, MY]);
p.push(fan(L.lint), fan(L.test), join(L.lint), join(L.test),
  D.line([[540, MY], [616, MY]]), D.line([[730, MY], [774, MY]]),
  D.line([[798, MY], [826, MY]]), D.line([[970, MY], [1044, MY]]));
// pre-PR gate
p.push(`<path class="m" style="stroke-width:4" d="M786 ${MY - 44} V${MY + 44}"/>`,
  `<path class="m" d="M776 ${MY - 44} H796 M776 ${MY + 44} H796"/>`,
  D.t(786, 32, "pre-PR gate", "mt"), D.t(786, 56, "all checkpoints present", "t mt"));
// pull request
p.push(D.dot(1056, MY, 10, "inkf"), D.t(1056, MY + 40, "pull", "t"), D.t(1056, MY + 60, "request", "t"));
// proof row
p.push(D.t(0, 260, "proof", "si", "start"));
proof(65, "files changed");
proof(250, "exit code 0");
proof(455, "code-review-verdict.json");
proof(675, "pipeline-report.md");
proof(900, "pr-url.txt");
// checkpoints feed the gate
const CY = 372;
p.push(D.t(0, CY - 20, "checkpoints/", "t", "start"),
  `<path class="thin" d="M0 ${CY} H786"/>`);
[[65, "code"], [235, ""], [265, ""], [455, "review"], [675, "report"]].forEach(([x]) =>
  p.push(`<rect class="inkf" x="${x - 7}" y="${CY - 7}" width="14" height="14" rx="2"/>`));
p.push(D.t(250, CY + 34, "lint, test", "t"), D.t(65, CY + 34, "code", "t"),
  D.t(455, CY + 34, "code_review", "t"), D.t(675, CY + 34, "report", "t"),
  D.line([[786, CY], [786, MY + 52]], "m"));
// lightweight pipeline
const LY = 466;
p.push(D.t(0, LY + 6, "lightweight", "si", "start"),
  D.dot(170, LY, 6), D.t(170, LY - 16, "code", "t"),
  D.line([[178, LY], [262, LY]]), D.dot(274, LY, 6), D.t(274, LY - 16, "lint + test", "t"),
  D.line([[282, LY], [376, LY]]), D.dot(388, LY, 6), D.t(388, LY - 16, "report", "t"),
  D.t(420, LY + 6, "stops here: no review, no pull request", "si", "start"));
D.draw(p);
</script></body></html>
